    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #1e1b4b, #4f46e5); min-height: 100vh; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .card { background: white; border-radius: 32px; padding: 24px; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.2); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        h1 { font-size: 24px; color: #1e1b4b; display: flex; align-items: center; gap: 10px; }
        .back-btn { background: #e2e8f0; border: none; border-radius: 40px; padding: 8px 20px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .back-btn:hover { background: #cbd5e1; }
        .ad-space { margin: 0 0 16px 0; border-radius: 20px; overflow: hidden; height: 80px; display: flex; align-items: center; justify-content: center; position: relative; background: #f1f5f9; }
        .job-card { background: #f8fafc; border-radius: 20px; padding: 16px; margin-bottom: 16px; border-left: 4px solid #10b981; transition: 0.2s; border: 1px solid #e2e8f0; }
        .job-card:hover { transform: scale(1.01); background: #eef2ff; }
        .job-title { font-weight: 700; font-size: 18px; margin-bottom: 4px; color: #1e1b4b; }
        .job-company { color: #4f46e5; margin-bottom: 8px; font-weight: 600; }
        .job-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
        .job-meta span { background: #e2e8f0; padding: 4px 12px; border-radius: 40px; font-size: 12px; }
        .job-meta span i { margin-right: 4px; }
        .apply-btn { background: #4f46e5; color: white; border: none; border-radius: 40px; padding: 8px 20px; cursor: pointer; margin-top: 12px; width: 100%; transition: 0.2s; font-weight: 600; }
        .apply-btn:hover { background: #4338ca; }
        .apply-btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .dark-mode { background: #0f172a; }
        .dark-mode .card { background: #1e293b; }
        .dark-mode .job-card { background: #1e293b; border-color: #10b981; color: #e2e8f0; border: 1px solid #334155; }
        .dark-mode .job-card:hover { background: #334155; }
        .dark-mode .job-title { color: #f1f5f9; }
        .dark-mode .back-btn { background: #334155; color: #e2e8f0; }
        .dark-mode .back-btn:hover { background: #475569; }
        .dark-mode .ad-space { background: #0f172a; }
        .dark-mode .job-meta span { background: #334155; color: #e2e8f0; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 8px 20px; border-radius: 40px; font-size: 14px; z-index: 2000; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 32px; max-width: 500px; width: 100%; padding: 24px; max-height: 90vh; overflow-y: auto; }
        .dark-mode .modal-content { background: #1e293b; color: #e2e8f0; }
        .modal-content input, .modal-content textarea { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 12px; 
            border: 1px solid #e2e8f0; 
            border-radius: 40px; 
            outline: none; 
            font-size: 14px;
            transition: 0.2s;
        }
        .modal-content input:focus, .modal-content textarea:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }
        .modal-content textarea { min-height: 100px; resize: vertical; border-radius: 20px; }
        .modal-content .btn-submit { 
            background: #4f46e5; 
            color: white; 
            border: none; 
            border-radius: 40px; 
            padding: 12px; 
            cursor: pointer; 
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            transition: 0.2s;
        }
        .modal-content .btn-submit:hover { background: #4338ca; }
        .modal-content .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
        .modal-content .btn-cancel {
            background: #e2e8f0;
            color: #1e293b;
            border: none;
            border-radius: 40px;
            padding: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            margin-top: 8px;
        }
        .dark-mode .modal-content input, .dark-mode .modal-content textarea {
            background: #334155;
            border-color: #475569;
            color: white;
        }
        .dark-mode .modal-content input::placeholder, .dark-mode .modal-content textarea::placeholder {
            color: #94a3b8;
        }
        .dark-mode .modal-content .btn-cancel {
            background: #334155;
            color: #e2e8f0;
        }
        .dark-mode .modal-content .btn-cancel:hover {
            background: #475569;
        }
        .empty-state { text-align: center; padding: 40px 20px; color: #94a3b8; }
        .empty-state i { font-size: 40px; display: block; margin-bottom: 12px; opacity: 0.5; }
        .loading-spinner { text-align: center; padding: 40px; color: #94a3b8; }
        .loading-spinner i { font-size: 30px; display: block; margin-bottom: 12px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-message { 
            padding: 12px; 
            border-radius: 16px; 
            margin-top: 12px; 
            display: none; 
            font-size: 14px; 
        }
        .status-message.success { 
            display: block; 
            background: #d1fae5; 
            color: #059669; 
            border: 1px solid #10b981; 
        }
        .status-message.error { 
            display: block; 
            background: #fee2e2; 
            color: #dc2626; 
            border: 1px solid #ef4444; 
        }
        .status-message .status-icon { font-size: 20px; margin-right: 8px; }
        .dark-mode .status-message.success { background: #064e3b; color: #6ee7b7; border-color: #10b981; }
        .dark-mode .status-message.error { background: #7f1d1d; color: #fca5a5; border-color: #ef4444; }
        .debug-console { background: #f1f5f9; padding: 12px; border-radius: 12px; margin-bottom: 16px; font-size: 13px; display: none; }
        .dark-mode .debug-console { background: #0f172a; border: 1px solid #334155; color: #94a3b8; }
    </style>

<body>
<div class="container">
    <div class="card">
        <div class="header">
            <h1><i class="fas fa-briefcase" style="color:#4f46e5;"></i> Job Vacancies</h1>
            <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> Back</button>
        </div>
        <div id="debugInfo" class="debug-console"></div>
        <div id="adContainer" class="ad-space">📢 Loading ad...</div>
        <div id="jobsList">
            <div class="loading-spinner"><i class="fas fa-spinner"></i> Loading jobs...</div>
        </div>
    </div>
</div>

<!-- Application Modal -->
<div class="modal" id="applicationModal">
    <div class="modal-content">
        <h3 style="margin-bottom: 12px;">Apply for <span id="jobTitleDisplay" style="color:#4f46e5;"></span></h3>
        <p style="color: #64748b; margin-bottom: 16px; font-size: 14px;">Fill in your details below. Your application will be sent directly to the admin.</p>
        
        <input type="text" id="appFullName" placeholder="Full Name *">
        <input type="email" id="appEmail" placeholder="Email Address *">
        <input type="tel" id="appPhone" placeholder="Phone Number *">
        <textarea id="appCoverLetter" placeholder="Why are you interested in this position? (Optional)"></textarea>
        
        <input type="hidden" id="appJobId">
        <input type="hidden" id="appPosition">
        <input type="hidden" id="appOrganization">
        
        <button class="btn-submit" id="submitApplication">
            <i class="fas fa-paper-plane"></i> Submit Application
        </button>
        <button class="btn-cancel" onclick="closeApplicationModal()">Cancel</button>
        <div id="appStatus" class="status-message"></div>
    </div>
</div>

<script>
    // Version check to ensure latest file is loaded
    console.log('📄 jobs.html loaded - Version 2.0');
    
const API_BASE = window.location.origin + '/api/';
    let currentUser = null;
    let adInterval = null;
    let currentJobId = null;

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }
    
    function showToast(msg, isError = false) {
        const t = document.createElement("div");
        t.className = "toast";
        t.innerText = msg;
        if (isError) t.style.background = "#dc2626";
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 4000);
    }

    // ==================== AD HELPER ====================
    function renderAd(containerId, location, intervalTime = 10000) {
        const container = document.getElementById(containerId);
        if (!container) return;
        
        if (adInterval) {
            clearInterval(adInterval);
            adInterval = null;
        }
        
        container.innerHTML = "📢 Loading ad...";
        container.style.cssText = `
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            cursor: default;
            color: #94a3b8;
            font-size: 14px;
        `;
        
        fetch(`${API_BASE}ads.php?location=${location}`)
            .then(response => response.json())
            .then(ads => {
                if (!ads || ads.length === 0) {
                    container.innerHTML = "📢 Ad space - Promote your school";
                    container.style.cssText = `
                        background: #f1f5f9;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        height: 80px;
                        border-radius: 20px;
                        overflow: hidden;
                        position: relative;
                        cursor: default;
                        color: #94a3b8;
                        font-size: 14px;
                    `;
                    return;
                }
                
                let idx = 0;
                
                function showAd() {
                    const ad = ads[idx % ads.length];
                    const imageUrl = ad.image_url || 'https://via.placeholder.com/800x100/4f46e5/ffffff?text=Ad';
                    const linkUrl = ad.link || '#';
                    
                    container.innerHTML = `
                        <img src="${imageUrl}" 
                             style="width:100%; height:80px; object-fit:cover; display:block;" 
                             onerror="this.style.display='none';this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:80px;background:#1e293b;color:#94a3b8;font-size:14px;\\'>📢 Ad</div>'">
                        <div style="position:absolute; bottom:4px; right:8px; background:rgba(0,0,0,0.6); color:white; font-size:10px; padding:2px 10px; border-radius:20px;">
                            ${ad.caption || "Sponsored"} | 👁️ ${ad.views || 0}
                        </div>
                    `;
                    container.style.cssText = `
                        background: transparent;
                        display: block;
                        height: 80px;
                        border-radius: 20px;
                        overflow: hidden;
                        position: relative;
                        cursor: pointer;
                        padding: 0;
                    `;
                    container.onclick = function(e) {
                        e.preventDefault();
                        if (linkUrl && linkUrl !== '#') {
                            window.open(linkUrl, "_blank");
                        }
                    };
                    idx++;
                }
                
                showAd();
                
                if (ads.length > 1) {
                    adInterval = setInterval(showAd, intervalTime);
                }
            })
            .catch(err => {
                console.error("Ad error:", err);
                container.innerHTML = "📢 Ad unavailable";
                container.style.cssText = `
                    background: #f1f5f9;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    height: 80px;
                    border-radius: 20px;
                    overflow: hidden;
                    position: relative;
                    cursor: default;
                    color: #94a3b8;
                    font-size: 14px;
                `;
            });
    }
    // =============================================

    async function checkAuth() {
        const token = localStorage.getItem('busahmed_token');
        if (!token) return null;
        try {
            const response = await fetch(API_BASE + 'profile.php?token=' + encodeURIComponent(token));
            if (!response.ok) return null;
            return await response.json();
        } catch(err) {
            console.error("Auth error:", err);
            return null;
        }
    }

    async function goBack() {
        const user = await checkAuth();
        if (user) {
            if (user.role === 'student') window.location.href = 'dashboard-student.html';
            else if (user.role === 'teacher') window.location.href = 'dashboard-teacher.html';
            else if (user.role === 'admin') window.location.href = 'dashboard-admin.html';
            else if (user.role === 'owner') window.location.href = 'dashboard-owner.html';
            else window.location.href = 'login.html';
        } else {
            window.location.href = 'login.html';
        }
    }

    async function loadJobs() {
        const debugDiv = document.getElementById('debugInfo');
        const container = document.getElementById('jobsList');
        
        // Show debug info
        debugDiv.style.display = 'block';
        debugDiv.innerHTML = '🔄 Loading jobs from API...';
        
        try {
            const url = API_BASE + 'jobs.php';
            console.log('📡 Fetching jobs from:', url);
            
            const response = await fetch(url);
            console.log('📡 Response status:', response.status);
            
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            
            const jobs = await response.json();
            console.log('💼 Jobs loaded:', jobs.length);
            
            debugDiv.innerHTML = '✅ Loaded ' + jobs.length + ' jobs successfully';
            debugDiv.style.background = '#d1fae5';
            debugDiv.style.color = '#059669';
            
            renderJobs(jobs);
        } catch(err) {
            console.error("Error loading jobs:", err);
            debugDiv.innerHTML = '❌ Error: ' + err.message;
            debugDiv.style.background = '#fee2e2';
            debugDiv.style.color = '#dc2626';
            container.innerHTML = "<div class='empty-state'><i class='fas fa-exclamation-circle' style='color:#ef4444;'></i>Error loading jobs: " + escapeHtml(err.message) + "</div>";
        }
    }

    function renderJobs(jobs) {
        const container = document.getElementById("jobsList");
        
        if (!jobs || jobs.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-briefcase"></i>
                    No job vacancies available.<br>
                    Check back later for new opportunities!
                </div>
            `;
            return;
        }
        
        let html = "";
        jobs.forEach(job => {
            const canApply = currentUser && (currentUser.role === 'teacher' || currentUser.role === 'owner' || currentUser.role === 'student');
            const postedDate = job.created_at ? new Date(job.created_at).toLocaleDateString('en-GB', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            }) : 'Recent';
            
            html += `
                <div class="job-card">
                    <div class="job-title">${escapeHtml(job.position)}</div>
                    <div class="job-company">${escapeHtml(job.organization)}</div>
                    <div class="job-meta">
                        <span><i class="fas fa-money-bill-wave"></i> ${escapeHtml(job.pay_range || 'Not specified')}</span>
                        <span><i class="fas fa-clock"></i> ${escapeHtml(job.type || 'Full-time')}</span>
                        <span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(job.location || 'Not specified')}</span>
                    </div>
                    <div style="font-size:12px; color:#94a3b8; margin-bottom:8px;">
                        <i class="far fa-calendar-alt"></i> Posted: ${postedDate}
                    </div>
                    ${canApply ? 
                        `<button class="apply-btn" onclick="openApplicationModal(${job.id}, '${escapeHtml(job.position)}', '${escapeHtml(job.organization)}')"><i class="fas fa-paper-plane"></i> Apply Now</button>` : 
                        `<p style="font-size:12px; margin-top:8px; color:#94a3b8; text-align:center;"><i class="fas fa-lock"></i> Login as Student/Teacher/Owner to apply</p>`
                    }
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // ==================== APPLICATION MODAL ====================
    function openApplicationModal(jobId, position, organization) {
        if (!currentUser) {
            showToast('Please login first to apply', true);
            return;
        }
        
        currentJobId = jobId;
        
        // Pre-fill user details if available
        document.getElementById('appFullName').value = currentUser.name || '';
        document.getElementById('appEmail').value = currentUser.email || '';
        document.getElementById('appPhone').value = currentUser.phone || '';
        document.getElementById('appCoverLetter').value = '';
        
        document.getElementById('appJobId').value = jobId;
        document.getElementById('appPosition').value = position;
        document.getElementById('appOrganization').value = organization;
        document.getElementById('jobTitleDisplay').textContent = position + ' at ' + organization;
        
        // Reset status
        const statusDiv = document.getElementById('appStatus');
        statusDiv.className = 'status-message';
        statusDiv.innerHTML = '';
        
        document.getElementById('applicationModal').classList.add('active');
        setTimeout(() => document.getElementById('appFullName').focus(), 300);
    }

    function closeApplicationModal() {
        document.getElementById('applicationModal').classList.remove('active');
        currentJobId = null;
    }

    document.getElementById('applicationModal').addEventListener('click', function(e) {
        if (e.target === this) closeApplicationModal();
    });

    document.getElementById('submitApplication').onclick = async function() {
        const fullName = document.getElementById('appFullName').value.trim();
        const email = document.getElementById('appEmail').value.trim();
        const phone = document.getElementById('appPhone').value.trim();
        const coverLetter = document.getElementById('appCoverLetter').value.trim();
        const jobId = document.getElementById('appJobId').value;
        const position = document.getElementById('appPosition').value;
        const organization = document.getElementById('appOrganization').value;
        
        // Validation
        if (!fullName) {
            showToast('Please enter your full name', true);
            document.getElementById('appFullName').focus();
            return;
        }
        if (!email) {
            showToast('Please enter your email address', true);
            document.getElementById('appEmail').focus();
            return;
        }
        if (!email.includes('@') || !email.includes('.')) {
            showToast('Please enter a valid email address', true);
            document.getElementById('appEmail').focus();
            return;
        }
        if (!phone) {
            showToast('Please enter your phone number', true);
            document.getElementById('appPhone').focus();
            return;
        }
        
        const btn = this;
        const statusDiv = document.getElementById('appStatus');
        statusDiv.className = 'status-message';
        statusDiv.innerHTML = '<span class="status-icon">⏳</span> Submitting application...';
        statusDiv.style.display = 'block';
        statusDiv.style.background = '#e2e8f0';
        statusDiv.style.color = '#1e293b';
        btn.disabled = true;
        
        const token = localStorage.getItem('busahmed_token');
        try {
            const response = await fetch(API_BASE + 'apply-job.php?token=' + encodeURIComponent(token), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    job_id: jobId,
                    full_name: fullName,
                    email: email,
                    phone: phone,
                    cover_letter: coverLetter,
                    position: position,
                    organization: organization
                })
            });
            
            const data = await response.json();
            
            if (data.success) {
                statusDiv.className = 'status-message success';
                statusDiv.innerHTML = '<span class="status-icon">✅</span> ' + data.message;
                showToast('✅ Application submitted successfully!');
                
                setTimeout(() => {
                    closeApplicationModal();
                    loadJobs();
                }, 3000);
            } else {
                statusDiv.className = 'status-message error';
                statusDiv.innerHTML = '<span class="status-icon">❌</span> ' + (data.error || 'Failed to submit application');
                showToast(data.error || 'Failed to submit application', true);
                btn.disabled = false;
            }
        } catch(err) {
            console.error('Application error:', err);
            statusDiv.className = 'status-message error';
            statusDiv.innerHTML = '<span class="status-icon">❌</span> Network error: ' + err.message;
            showToast('Network error: ' + err.message, true);
            btn.disabled = false;
        }
    };

    // ==================== ENTER KEY SUPPORT ====================
    document.getElementById('appPhone').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') document.getElementById('submitApplication').click();
    });

    // ==================== INIT ====================
    async function init() {
        console.log('🚀 jobs.html initializing...');
        currentUser = await checkAuth();
        console.log('👤 Current user:', currentUser ? currentUser.name : 'Not logged in');
        await loadJobs();
        renderAd('adContainer', 'jobs', 10000);
        document.getElementById("backBtn").onclick = goBack;
        
        if (localStorage.getItem("busahmed_dark_mode") === "true") document.body.classList.add("dark-mode");
    }
    
    init();
    window.openApplicationModal = openApplicationModal;
    window.closeApplicationModal = closeApplicationModal;
</script>
