        .btn-delete { background: #dc2626; color: white; border: none; border-radius: 40px; padding: 6px 16px; cursor: pointer; font-weight: 500; transition: 0.2s; }
        .btn-delete:hover { background: #b91c1c; }
        .btn-view { background: #4f46e5; color: white; border: none; border-radius: 40px; padding: 6px 16px; cursor: pointer; font-weight: 500; transition: 0.2s; }
        .btn-view:hover { background: #4338ca; }
        .btn-stats { background: #8b5cf6; color: white; border: none; border-radius: 40px; padding: 6px 16px; cursor: pointer; font-weight: 500; transition: 0.2s; }
        .btn-stats:hover { background: #7c3aed; }
        .status-badge { display: inline-block; padding: 2px 10px; border-radius: 40px; font-size: 11px; font-weight: 600; }

        .dark-mode h1 { color: #f1f5f9; }

        .dark-mode .video-meta { color: #94a3b8; }

        .dark-mode .video-desc { color: #94a3b8; }
        .dark-mode .admin-notes { background: #7f1d1d; color: #fca5a5; }
        .dark-mode .back-btn { background: #334155; color: #e2e8f0; }

        .modal-content .btn-confirm:hover { background: #dc2626; }
        .modal-content .btn-cancel { width: 100%; padding: 12px; margin-top: 8px; background: #e2e8f0; color: #1e293b; border: none; border-radius: 40px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .modal-content .btn-cancel:hover { background: #cbd5e1; }

        .video-preview { width: 120px; height: 68px; object-fit: cover; border-radius: 8px; background: #000; }
        .points-badge { background: #10b981; color: white; padding: 2px 10px; border-radius: 40px; font-size: 10px; font-weight: 600; }
        .admin-badge { background: #8b5cf6; color: white; padding: 2px 10px; border-radius: 40px; font-size: 10px; font-weight: 600; }
        .source-label { font-size: 10px; color: #94a3b8; margin-left: 4px; }

<body>
<div class="container">
    <div class="card">
        <div class="header">
            <h1><i class="fas fa-video" style="color:#4f46e5;"></i> Video Manager</h1>
            <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> Back</button>
        </div>
        <div class="tabs">
            <div class="tab active" data-tab="pending">⏳ Pending <span id="pendingBadge" class="tab-badge" style="display:none;">0</span></div>
            <div class="tab" data-tab="approved">✅ Approved</div>
            <div class="tab" data-tab="rejected">❌ Rejected</div>
            <div class="tab" data-tab="all">📋 All</div>
        </div>
        <div id="videoList">
            <div class="loading-spinner"><i class="fas fa-spinner"></i> Loading videos...</div>
        </div>
    </div>
</div>

<!-- Reject Modal -->
<div class="modal" id="rejectModal">
    <div class="modal-content">
        <h3 style="margin-bottom:12px;"><i class="fas fa-times-circle" style="color:#ef4444;"></i> Reject Video</h3>
        <p style="color:#64748b; font-size:14px; margin-bottom:12px;">Provide a reason for rejection (optional)</p>
        <textarea id="rejectNotes" placeholder="Reason for rejection..."></textarea>
        <button class="btn-confirm" id="confirmRejectBtn"><i class="fas fa-check"></i> Confirm Reject</button>
        <button class="btn-cancel" onclick="closeRejectModal()">Cancel</button>
    </div>
</div>

<script>
const API_BASE = window.location.origin + '/api/';
    let currentUser = null;
    let currentStatus = 'pending';
    let currentUploadId = null;

    function getToken() {
        return localStorage.getItem('busahmed_token');
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    function showToast(msg, isError = false) {
        const t = document.createElement("div");
        t.className = "toast";
        t.innerText = msg;
        if (isError) t.style.background = "#dc2626";
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    async function checkAuth() {
        const token = getToken();
        if (!token) {
            window.location.href = 'login.html';
            return null;
        }
        try {
            const response = await fetch(API_BASE + 'profile.php?token=' + encodeURIComponent(token));
            if (!response.ok) {
                localStorage.clear();
                window.location.href = 'login.html';
                return null;
            }
            currentUser = await response.json();
            if (currentUser.role !== 'admin') {
                window.location.href = 'login.html';
                return null;
            }
            return currentUser;
        } catch(err) {
            console.error("Auth error:", err);
            window.location.href = 'login.html';
            return null;
        }
    }

    function goBack() {
        window.location.href = 'dashboard-admin.html';
    }

    function formatDuration(seconds) {
        if (!seconds || isNaN(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return mins + ':' + String(secs).padStart(2, '0');
    }

    // ==================== PREVIEW VIDEO - FIXED ====================
    function previewVideo(videoUrl) {
        if (!videoUrl) {
            showToast('Video URL not available', true);
            return;
        }
        
        // Build the full URL correctly
        let fullUrl = videoUrl;
        
        // If the URL starts with 'uploads/', add the base path
        if (videoUrl.startsWith('uploads/')) {
            // Get the base URL (without the api part)
            const baseUrl = window.location.origin + '/busahmed/';
            fullUrl = baseUrl + videoUrl;
        } 
        // If it doesn't start with http, add the base URL
        else if (!videoUrl.startsWith('http://') && !videoUrl.startsWith('https://')) {
            // Remove leading slash if present
            const cleanUrl = videoUrl.replace(/^\//, '');
            const baseUrl = window.location.origin + '/busahmed/';
            fullUrl = baseUrl + cleanUrl;
        }
        
        console.log('🔍 Opening preview URL:', fullUrl);
        window.open(fullUrl, '_blank');
    }

    async function loadVideos(status) {
        const token = getToken();
        if (!token) return;
        
        const container = document.getElementById('videoList');
        container.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner"></i> Loading videos...</div>';
        
        let url;
        if (status === 'all') {
            url = API_BASE + 'admin-videos.php?token=' + encodeURIComponent(token) + '&status=all&include_admin=1';
        } else {
            url = API_BASE + 'admin-videos.php?token=' + encodeURIComponent(token) + '&status=' + status;
        }
        
        try {
            const response = await fetch(url);
            const data = await response.json();
            
            if (data.success) {
                let uploads = data.uploads || [];
                renderVideos(uploads, status);
                
                if (status === 'pending' || status === 'all') {
                    const pendingCount = uploads.filter(u => u.status === 'pending').length;
                    const badge = document.getElementById('pendingBadge');
                    if (pendingCount > 0) {
                        badge.textContent = pendingCount;
                        badge.style.display = 'inline-block';
                    } else {
                        badge.style.display = 'none';
                    }
                }
            } else {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>${escapeHtml(data.error || 'Failed to load videos')}</div>`;
            }
        } catch(err) {
            console.error('Load videos error:', err);
            container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>Error loading videos. Please try again.</div>';
        }
    }

    function renderVideos(uploads, status) {
        const container = document.getElementById('videoList');
        
        if (!uploads || uploads.length === 0) {
            const labels = { pending: 'pending', approved: 'approved', rejected: 'rejected', all: 'videos' };
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    No ${labels[status] || status} videos
                </div>
            `;
            return;
        }
        
        let html = '';
        uploads.forEach(u => {
            const statusClass = {
                pending: 'status-pending',
                approved: 'status-approved',
                rejected: 'status-rejected'
            }[u.status] || 'status-pending';
            
            const statusLabel = {
                pending: '⏳ Pending',
                approved: '✅ Approved',
                rejected: '❌ Rejected'
            }[u.status] || u.status;
            
            const duration = u.duration || 0;
            const pointsAwarded = u.points_awarded || false;
            const isAdminUpload = u.is_admin_upload || u.source_type === 'admin' || u.user_role === 'admin';
            const sourceLabel = isAdminUpload ? '👑 Admin Upload' : '📤 User Upload';
            
            const borderColor = u.status === 'pending' ? '#f59e0b' : (u.status === 'approved' ? '#10b981' : '#ef4444');
            
            html += `
                <div class="video-upload-item" style="border-left-color: ${borderColor};" id="video-item-${u.id}">
                    <div class="video-info">
                        <div style="flex:1;">
                            <div class="video-title">${escapeHtml(u.title || 'Untitled')}</div>
                            <div class="video-meta">
                                <strong>${escapeHtml(u.user_name || 'Unknown')}</strong> • 
                                ${escapeHtml(u.user_role || 'user')} • 
                                ${duration ? formatDuration(duration) : 'N/A'} • 
                                <span class="status-badge ${statusClass}">${statusLabel}</span>
                                ${isAdminUpload ? '<span class="admin-badge">👑 Admin</span>' : ''}
                                ${pointsAwarded && !isAdminUpload ? '<span class="points-badge">⭐ +10 pts</span>' : ''}
                                <span class="source-label">${sourceLabel}</span>
                            </div>
                            <div class="video-meta" style="font-size:12px;">
                                📅 ${u.created_at ? new Date(u.created_at).toLocaleDateString() : 'N/A'} 
                                ${u.video_views ? `• 👁️ ${u.video_views} views` : ''}
                                ${u.video_likes ? `• ❤️ ${u.video_likes} likes` : ''}
                            </div>
                        </div>
                        ${u.thumbnail_url ? `<img src="${u.thumbnail_url}" class="video-preview" onerror="this.style.display='none'">` : ''}
                    </div>
                    ${u.description ? `<div class="video-desc">${escapeHtml(u.description)}</div>` : ''}
                    ${u.tags ? `<div class="video-meta" style="font-size:12px; margin-top:4px;">🏷️ ${escapeHtml(u.tags)}</div>` : ''}
                    ${u.admin_notes ? `<div class="admin-notes">📝 ${escapeHtml(u.admin_notes)}</div>` : ''}
                    <div class="btn-group">
                        ${u.status === 'pending' && !isAdminUpload ? `
                            <button class="btn-approve" onclick="approveVideo(${u.id})"><i class="fas fa-check"></i> Approve</button>
                            <button class="btn-reject" onclick="openRejectModal(${u.id})"><i class="fas fa-times"></i> Reject</button>
                        ` : ''}
                        <button class="btn-view" onclick="previewVideo('${u.video_url || ''}')"><i class="fas fa-play"></i> Preview</button>
                        <button class="btn-delete" onclick="deleteVideo(${u.id}, '${u.source_type || 'upload'}')"><i class="fas fa-trash"></i> Delete</button>
                        ${u.video_id ? `<button class="btn-stats" onclick="viewStats(${u.video_id})"><i class="fas fa-chart-bar"></i> Stats</button>` : ''}
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    async function approveVideo(uploadId) {
        if (!confirm('Approve this video? The uploader will earn 10 points!')) return;
        
        const token = getToken();
        try {
            const response = await fetch(API_BASE + 'admin-videos.php?token=' + encodeURIComponent(token), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ upload_id: uploadId, action: 'approve' })
            });
            
            const data = await response.json();
            if (data.success) {
                showToast('✅ ' + data.message);
                loadVideos(currentStatus);
            } else {
                showToast(data.error || 'Failed to approve', true);
            }
        } catch(err) {
            console.error('Approve error:', err);
            showToast('Error approving video', true);
        }
    }

    function openRejectModal(uploadId) {
        currentUploadId = uploadId;
        document.getElementById('rejectNotes').value = '';
        document.getElementById('rejectModal').classList.add('active');
    }

    function closeRejectModal() {
        document.getElementById('rejectModal').classList.remove('active');
        currentUploadId = null;
    }

    document.getElementById('confirmRejectBtn').onclick = async function() {
        if (!currentUploadId) {
            showToast('No video selected', true);
            return;
        }
        
        const notes = document.getElementById('rejectNotes').value.trim();
        const token = getToken();
        
        try {
            const response = await fetch(API_BASE + 'admin-videos.php?token=' + encodeURIComponent(token), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    upload_id: currentUploadId, 
                    action: 'reject',
                    admin_notes: notes
                })
            });
            
            const data = await response.json();
            if (data.success) {
                showToast('Video rejected');
                closeRejectModal();
                loadVideos(currentStatus);
            } else {
                showToast(data.error || 'Failed to reject', true);
            }
        } catch(err) {
            console.error('Reject error:', err);
            showToast('Error rejecting video', true);
        }
    };

    async function deleteVideo(uploadId, sourceType) {
        const isAdmin = sourceType === 'admin';
        const confirmMsg = isAdmin 
            ? 'Are you sure you want to permanently delete this admin uploaded video? This cannot be undone!'
            : 'Are you sure you want to permanently delete this video? This cannot be undone!';
        
        if (!confirm(confirmMsg)) return;
        
        const token = getToken();
        try {
            const response = await fetch(API_BASE + 'admin-videos.php?token=' + encodeURIComponent(token), {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    upload_id: uploadId,
                    source_type: sourceType || 'upload'
                })
            });
            
            const data = await response.json();
            if (data.success) {
                showToast('✅ Video deleted successfully');
                loadVideos(currentStatus);
            } else {
                showToast(data.error || 'Failed to delete', true);
            }
        } catch(err) {
            console.error('Delete error:', err);
            showToast('Error deleting video', true);
        }
    }

    function viewStats(videoId) {
        const item = document.querySelector(`.video-upload-item .btn-stats[onclick*="${videoId}"]`);
        if (item) {
            const parent = item.closest('.video-upload-item');
            const title = parent.querySelector('.video-title')?.textContent || 'Video';
            const views = parent.querySelector('.video-meta')?.textContent.match(/👁️ (\d+)/)?.[1] || '0';
            const likes = parent.querySelector('.video-meta')?.textContent.match(/❤️ (\d+)/)?.[1] || '0';
            
            alert(`📊 Stats for "${title}"\n\n👁️ Views: ${views}\n❤️ Likes: ${likes}\n📅 Uploaded: ${new Date().toLocaleDateString()}`);
        }
    }

    // Close modal on outside click
    document.getElementById('rejectModal').addEventListener('click', function(e) {
        if (e.target === this) closeRejectModal();
    });

    // ESC key to close modal
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && document.getElementById('rejectModal').classList.contains('active')) {
            closeRejectModal();
        }
    });

    // Tab switching
    function setupTabs() {
        document.querySelectorAll('.tab').forEach(tab => {
            tab.onclick = function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentStatus = this.dataset.tab;
                loadVideos(currentStatus);
            };
        });
    }

    // Expose functions globally
    window.approveVideo = approveVideo;
    window.openRejectModal = openRejectModal;
    window.closeRejectModal = closeRejectModal;
    window.deleteVideo = deleteVideo;
    window.viewStats = viewStats;
    window.previewVideo = previewVideo;
    window.loadVideos = loadVideos;

    async function init() {
        await checkAuth();
        if (!currentUser) return;
        
        document.getElementById('backBtn').onclick = goBack;
        setupTabs();
        await loadVideos('pending');
        
        if (localStorage.getItem("busahmed_dark_mode") === "true") {
            document.body.classList.add("dark-mode");
        }
    }
    
    init();
</script>
</body>
</html>
