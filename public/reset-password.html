    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #1e1b4b, #4f46e5); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .reset-card { background: white; border-radius: 32px; padding: 32px; max-width: 400px; width: 100%; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.2); }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo i { font-size: 48px; color: #4f46e5; }
        .logo h1 { font-size: 28px; margin-top: 8px; color: #1e1b4b; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 4px; color: #1e293b; font-size: 14px; }
        .input-group input { width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 40px; font-size: 16px; outline: none; transition: 0.2s; }
        .input-group input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
        .input-group .password-toggle { position: relative; }
        .input-group .password-toggle input { padding-right: 50px; }
        .input-group .password-toggle .toggle-btn { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #94a3b8; font-size: 18px; }
        button { width: 100%; padding: 14px; background: #4f46e5; color: white; border: none; border-radius: 40px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #4338ca; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .error-msg { background: #fee2e2; color: #dc2626; padding: 12px; border-radius: 40px; margin-bottom: 16px; display: none; font-size: 14px; }
        .success-msg { background: #d1fae5; color: #059669; padding: 12px; border-radius: 40px; margin-bottom: 16px; display: none; font-size: 14px; }
        .footer { text-align: center; margin-top: 24px; font-size: 14px; color: #64748b; }
        .footer a { color: #4f46e5; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
        .dark-mode { background: #0f172a; }
        .dark-mode .reset-card { background: #1e293b; color: #e2e8f0; }
        .dark-mode .logo h1 { color: #f1f5f9; }
        .dark-mode .input-group label { color: #e2e8f0; }
        .dark-mode .input-group input { background: #334155; border-color: #475569; color: white; }
        .dark-mode .input-group input::placeholder { color: #94a3b8; }
        .dark-mode .footer a { color: #a5b4fc; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 10px 24px; border-radius: 40px; font-size: 14px; z-index: 2000; }
        .requirements { font-size: 12px; color: #94a3b8; margin-top: 4px; }
        .requirements .valid { color: #10b981; }
        .requirements .invalid { color: #dc2626; }
    </style>
</head>
<body>
<div class="reset-card">
    <div class="logo">
        <i class="fas fa-key"></i>
        <h1>Reset Password</h1>
        <p style="color:#64748b; font-size:14px;">Enter your new password below</p>
    </div>
    <div id="errorMsg" class="error-msg"></div>
    <div id="successMsg" class="success-msg"></div>
    <div id="infoMsg" style="background:#e2e8f0; color:#1e293b; padding:12px; border-radius:40px; margin-bottom:16px; font-size:14px; display:none;"></div>
    
    <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="resetEmail" readonly style="background:#f1f5f9; cursor:not-allowed;">
    </div>
    
    <div class="input-group">
        <label>New Password</label>
        <div class="password-toggle">
            <input type="password" id="newPassword" placeholder="Enter new password">
            <button class="toggle-btn" onclick="togglePassword('newPassword', this)" type="button">
                <i class="fas fa-eye"></i>
            </button>
        </div>
        <div class="requirements">
            <span id="lengthCheck">❌ At least 6 characters</span>
        </div>
    </div>
    
    <div class="input-group">
        <label>Confirm Password</label>
        <div class="password-toggle">
            <input type="password" id="confirmPassword" placeholder="Confirm new password">
            <button class="toggle-btn" onclick="togglePassword('confirmPassword', this)" type="button">
                <i class="fas fa-eye"></i>
            </button>
        </div>
        <div class="requirements">
            <span id="matchCheck">❌ Passwords match</span>
        </div>
    </div>
    
    <button id="resetBtn"><i class="fas fa-save"></i> Reset Password</button>
    <div class="footer"><a href="login.html">Back to Login</a></div>
</div>

<script>
const API_BASE = window.location.origin + '/api/';

    function showError(msg) {
        const errDiv = document.getElementById("errorMsg");
        errDiv.innerText = msg;
        errDiv.style.display = "block";
        setTimeout(() => errDiv.style.display = "none", 5000);
    }

    function showSuccess(msg) {
        const sucDiv = document.getElementById("successMsg");
        sucDiv.innerText = msg;
        sucDiv.style.display = "block";
        setTimeout(() => sucDiv.style.display = "none", 5000);
    }

    function showToast(msg, isError = false) {
        const t = document.createElement("div");
        t.className = "toast";
        t.innerText = msg;
        if (isError) t.style.background = "#dc2626";
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fas fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fas fa-eye';
        }
    }

    function validatePassword() {
        const password = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;
        const lengthCheck = document.getElementById('lengthCheck');
        const matchCheck = document.getElementById('matchCheck');

        // Length check
        if (password.length >= 6) {
            lengthCheck.innerHTML = '✅ At least 6 characters';
            lengthCheck.className = 'valid';
        } else {
            lengthCheck.innerHTML = '❌ At least 6 characters';
            lengthCheck.className = 'invalid';
        }

        // Match check
        if (password && password === confirm) {
            matchCheck.innerHTML = '✅ Passwords match';
            matchCheck.className = 'valid';
        } else if (confirm) {
            matchCheck.innerHTML = '❌ Passwords do not match';
            matchCheck.className = 'invalid';
        } else {
            matchCheck.innerHTML = '❌ Passwords match';
            matchCheck.className = 'invalid';
        }
    }

    document.getElementById('newPassword').addEventListener('input', validatePassword);
    document.getElementById('confirmPassword').addEventListener('input', validatePassword);

    document.getElementById('resetBtn').onclick = async function() {
        const btn = this;
        const email = document.getElementById('resetEmail').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // Clear previous messages
        document.getElementById('errorMsg').style.display = 'none';
        document.getElementById('successMsg').style.display = 'none';

        if (!token || !email) {
            showError('Invalid reset link. Please request a new one.');
            return;
        }

        if (!newPassword) {
            showError('Please enter a new password');
            document.getElementById('newPassword').focus();
            return;
        }

        if (newPassword.length < 6) {
            showError('Password must be at least 6 characters');
            document.getElementById('newPassword').focus();
            return;
        }

        if (newPassword !== confirmPassword) {
            showError('Passwords do not match');
            document.getElementById('confirmPassword').focus();
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';

        try {
            const response = await fetch(API_BASE + 'reset-password.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    token: token, 
                    email: email, 
                    new_password: newPassword,
                    confirm_password: confirmPassword
                })
            });

            const data = await response.json();

            if (data.success) {
                showSuccess('✅ ' + data.message);
                showToast('✅ Password reset successfully! Redirecting to login...');
                btn.innerHTML = '✅ Done!';
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);
            } else {
                showError(data.error || 'Failed to reset password');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Reset Password';
            }
        } catch(err) {
            console.error('Reset error:', err);
            showError('Network error: ' + err.message);
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-save"></i> Reset Password';
        }
    };

    // Load email from URL
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email');
    const token = urlParams.get('token');

    if (email) {
        document.getElementById('resetEmail').value = decodeURIComponent(email);
    } else {
        document.getElementById('infoMsg').style.display = 'block';
        document.getElementById('infoMsg').innerHTML = '⚠️ No email found in the link. Please use the link from your email.';
    }

    if (!token) {
        document.getElementById('infoMsg').style.display = 'block';
        document.getElementById('infoMsg').innerHTML = '⚠️ Invalid reset link. Please request a new one.';
        document.getElementById('resetBtn').disabled = true;
    }

    if (localStorage.getItem("busahmed_dark_mode") === "true") {
        document.body.classList.add("dark-mode");
    }
</script>
</body>
