<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BUSAHMED | User Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
 <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BUSAHMED">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileColor" content="#4f46e5">
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png">
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-57x57.png" sizes="57x57">
    <link rel="apple-touch-icon" href="/icons/icon-72x72.png" sizes="72x72">
    <link rel="apple-touch-icon" href="/icons/icon-76x76.png" sizes="76x76">
    <link rel="apple-touch-icon" href="/icons/icon-114x114.png" sizes="114x114">
    <link rel="apple-touch-icon" href="/icons/icon-120x120.png" sizes="120x120">
    <link rel="apple-touch-icon" href="/icons/icon-144x144.png" sizes="144x144">
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png" sizes="152x152">
    <link rel="apple-touch-icon" href="/icons/icon-167x167.png" sizes="167x167">
    <link rel="apple-touch-icon" href="/icons/icon-180x180.png" sizes="180x180">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
    <link rel="shortcut icon" href="/icons/favicon.ico">
    
    <!-- Microsoft Tiles -->
    <meta name="msapplication-square70x70logo" content="/icons/icon-72x72.png">
    <meta name="msapplication-square150x150logo" content="/icons/icon-144x144.png">
    <meta name="msapplication-wide310x150logo" content="/icons/icon-384x384.png">
    <meta name="msapplication-square310x310logo" content="/icons/icon-512x512.png">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #1e1b4b, #4f46e5); min-height: 100vh; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .card { background: white; border-radius: 32px; padding: 24px; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.2); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        h1 { font-size: 24px; color: #1e1b4b; display: flex; align-items: center; gap: 10px; }
        .back-btn { background: #e2e8f0; border: none; border-radius: 40px; padding: 8px 20px; cursor: pointer; font-weight: 600; }
        .profile-header { text-align: center; margin-bottom: 24px; }
        .avatar { width: 100px; height: 100px; background: #cbd5e1; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; overflow: hidden; font-size: 48px; color: #475569; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .name { font-size: 24px; font-weight: 700; color: #1e1b4b; }
        .role-badge { display: inline-block; background: #e0e7ff; color: #4f46e5; padding: 4px 12px; border-radius: 40px; font-size: 12px; margin-top: 8px; }
        .rating-stars { color: #fbbf24; margin: 8px 0; font-size: 18px; }
        .follow-btn { background: #4f46e5; color: white; border: none; border-radius: 40px; padding: 8px 24px; cursor: pointer; font-weight: 600; margin-top: 12px; transition: 0.2s; }
        .follow-btn:hover { transform: scale(1.05); }
        .follow-btn.following { background: #10b981; }
        .follow-btn.following:hover { background: #059669; }
        .chat-btn { background: #4f46e5; color: white; border: none; border-radius: 40px; padding: 8px 24px; cursor: pointer; font-weight: 600; margin-top: 12px; margin-left: 8px; transition: 0.2s; }
        .chat-btn:hover { background: #4338ca; transform: scale(1.05); }
        .stats-row { display: flex; justify-content: center; gap: 30px; margin: 16px 0; }
        .stats-row .stat-item { text-align: center; }
        .stats-row .stat-number { font-size: 24px; font-weight: 700; color: #4f46e5; }
        .stats-row .stat-label { font-size: 12px; color: #64748b; }
        .info-section { background: #f8fafc; border-radius: 20px; padding: 16px; margin-top: 16px; }
        .info-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #e2e8f0; }
        .info-row:last-child { border-bottom: none; }
        .info-icon { width: 32px; color: #4f46e5; }
        .dark-mode { background: #0f172a; }
        .dark-mode .card { background: #1e293b; }
        .dark-mode .name { color: #f1f5f9; }
        .dark-mode .info-section { background: #1e293b; border-color: #334155; color: #e2e8f0; }
        .dark-mode .back-btn { background: #334155; color: #e2e8f0; }
        .dark-mode .role-badge { background: #334155; color: #a5b4fc; }
        .dark-mode .stats-row .stat-number { color: #a5b4fc; }
        .dark-mode .stats-row .stat-label { color: #94a3b8; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 8px 20px; border-radius: 40px; font-size: 14px; z-index: 2000; }
        .btn-group { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
        .loading-spinner { text-align: center; padding: 40px; color: #94a3b8; }
        .loading-spinner i { font-size: 30px; display: block; margin-bottom: 12px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <h1><i class="fas fa-user-circle" style="color:#4f46e5;"></i> User Profile</h1>
            <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> Back</button>
        </div>
        <div id="profileContent">
            <div class="loading-spinner"><i class="fas fa-spinner"></i> Loading profile...</div>
        </div>
    </div>
</div>

<script>
const API_BASE = window.location.origin + '/api/';
    let currentUser = null;
    let viewedUser = null;

    function showToast(msg, isError = false) { 
        const t = document.createElement("div"); 
        t.className = "toast"; 
        t.innerText = msg; 
        if (isError) t.style.background = "#dc2626"; 
        document.body.appendChild(t); 
        setTimeout(() => t.remove(), 2500); 
    }
    
    function escapeHtml(str) { 
        if (!str) return ""; 
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); 
    }

    function getToken() {
        return localStorage.getItem('busahmed_token');
    }

    function generateStars(rating) {
        // Handle null, undefined, or string values
        const numRating = parseFloat(rating);
        if (!numRating || isNaN(numRating)) {
            return '☆☆☆☆☆';
        }
        const full = Math.floor(numRating);
        let stars = '';
        for (let i = 0; i < full; i++) stars += '★';
        for (let i = stars.length; i < 5; i++) stars += '☆';
        return stars;
    }

    function formatRating(rating) {
        const numRating = parseFloat(rating);
        if (!numRating || isNaN(numRating)) {
            return 'Not rated';
        }
        return numRating.toFixed(1);
    }

    async function getCurrentUser() {
        const token = getToken();
        if (!token) return null;
        try {
            const res = await fetch(API_BASE + 'profile.php?token=' + encodeURIComponent(token));
            if (!res.ok) return null;
            return await res.json();
        } catch (err) { 
            console.error('Get current user error:', err);
            return null; 
        }
    }

    async function loadUserProfile(userId) {
        try {
            const res = await fetch(API_BASE + 'user-profile.php?id=' + userId);
            if (!res.ok) return null;
            return await res.json();
        } catch (err) { 
            console.error('Load user profile error:', err);
            return null; 
        }
    }

    async function loadUserStats(userId) {
        try {
            const res = await fetch(API_BASE + 'user-stats.php?id=' + userId);
            const data = await res.json();
            return {
                questions: data.questions || 0,
                answers: data.answers || 0,
                points: data.points || 0
            };
        } catch (err) { 
            console.error('Load user stats error:', err);
            return { questions: 0, answers: 0, points: 0 }; 
        }
    }

    async function toggleFollow() {
        if (!currentUser) { 
            showToast("Please login to follow users", true); 
            return; 
        }
        if (currentUser.id === viewedUser.id) { 
            showToast("You cannot follow yourself", true); 
            return; 
        }
        
        const followBtn = document.getElementById('followBtn');
        const isCurrentlyFollowing = followBtn.classList.contains('following');
        const action = isCurrentlyFollowing ? 'unfollow' : 'follow';
        
        if (isCurrentlyFollowing) {
            followBtn.textContent = 'Follow';
            followBtn.classList.remove('following');
            followBtn.style.background = '#4f46e5';
        } else {
            followBtn.textContent = '✓ Following';
            followBtn.classList.add('following');
            followBtn.style.background = '#10b981';
        }
        
        const token = getToken();
        try {
            const res = await fetch(API_BASE + 'follow.php?token=' + encodeURIComponent(token), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: viewedUser.id, action })
            });
            
            const data = await res.json();
            if (data.success) {
                showToast(data.message || (action === 'follow' ? `Following ${viewedUser.name}` : `Unfollowed ${viewedUser.name}`));
                
                if (action === 'follow') {
                    if (!viewedUser.current_user_following) {
                        viewedUser.current_user_following = [];
                    }
                    viewedUser.current_user_following.push(viewedUser.id);
                } else {
                    if (viewedUser.current_user_following) {
                        viewedUser.current_user_following = viewedUser.current_user_following.filter(id => id !== viewedUser.id);
                    }
                }
                
                followBtn.textContent = '✓ Following';
                followBtn.classList.add('following');
                followBtn.style.background = '#10b981';
                
            } else {
                if (isCurrentlyFollowing) {
                    followBtn.textContent = '✓ Following';
                    followBtn.classList.add('following');
                    followBtn.style.background = '#10b981';
                } else {
                    followBtn.textContent = 'Follow';
                    followBtn.classList.remove('following');
                    followBtn.style.background = '#4f46e5';
                }
                showToast(data.error || "Failed", true);
            }
        } catch(err) {
            if (isCurrentlyFollowing) {
                followBtn.textContent = '✓ Following';
                followBtn.classList.add('following');
                followBtn.style.background = '#10b981';
            } else {
                followBtn.textContent = 'Follow';
                followBtn.classList.remove('following');
                followBtn.style.background = '#4f46e5';
            }
            showToast("Network error", true);
        }
    }

    async function rateUser(rating) {
        if (!currentUser) { showToast("Please login to rate", true); return; }
        if (currentUser.id === viewedUser.id) { showToast("You cannot rate yourself", true); return; }
        const token = getToken();
        try {
            const res = await fetch(API_BASE + 'rate-user.php?token=' + encodeURIComponent(token), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: viewedUser.id, rating })
            });
            const data = await res.json();
            if (data.success) {
                showToast(`You rated ${viewedUser.name} ${rating} stars!`);
                viewedUser = await loadUserProfile(viewedUser.id);
                renderProfile();
            } else { 
                showToast(data.error || "Failed to rate", true); 
            }
        } catch(err) {
            showToast("Network error", true);
        }
    }
    
    function startChatWithUser(userId) {
        window.location.href = 'chat.html?user_id=' + userId;
    }

    async function renderProfile() {
        if (!viewedUser) {
            document.getElementById("profileContent").innerHTML = `
                <div style="text-align:center; padding:40px; color:#dc2626;">
                    <i class="fas fa-exclamation-circle" style="font-size:32px; display:block; margin-bottom:12px;"></i>
                    User not found
                </div>
            `;
            return;
        }
        
        // Load stats with error handling
        let stats = { questions: 0, answers: 0, points: 0 };
        try {
            stats = await loadUserStats(viewedUser.id);
        } catch(err) {
            console.error('Stats error:', err);
            stats = { questions: 0, answers: 0, points: 0 };
        }
        
        const isFollowing = viewedUser.current_user_following && viewedUser.current_user_following.includes(viewedUser.id);
        const canRate = currentUser && currentUser.id !== viewedUser.id;
        const canChat = currentUser && currentUser.id !== viewedUser.id;
        
        let roleSpecific = "";
        if (viewedUser.role === "student") roleSpecific = `<div class="info-row"><div class="info-icon"><i class="fas fa-graduation-cap"></i></div><div>Class: ${escapeHtml(viewedUser.class || "Not specified")}</div></div>`;
        else if (viewedUser.role === "teacher") roleSpecific = `<div class="info-row"><div class="info-icon"><i class="fas fa-chalkboard-teacher"></i></div><div>Subject: ${escapeHtml(viewedUser.subject || "Not specified")}</div></div>`;
        else if (viewedUser.role === "owner") roleSpecific = `<div class="info-row"><div class="info-icon"><i class="fas fa-school"></i></div><div>School: ${escapeHtml(viewedUser.school || "Not specified")}</div></div>`;
        
        let avatarHtml = viewedUser.avatar ? `<img src="${viewedUser.avatar}">` : `<i class="fas fa-user"></i>`;
        const starsDisplay = generateStars(viewedUser.average_rating);
        const ratingDisplay = formatRating(viewedUser.average_rating);
        
        let html = `<div class="profile-header">
                        <div class="avatar">${avatarHtml}</div>
                        <div class="name">${escapeHtml(viewedUser.name)}</div>
                        <div class="role-badge">${viewedUser.role === 'student' ? '🎓 Student' : viewedUser.role === 'teacher' ? '👨‍🏫 Teacher' : viewedUser.role === 'owner' ? '🏫 School Owner' : '👤 User'}</div>
                        <div class="rating-stars">${starsDisplay} (${ratingDisplay})</div>
                        <div class="stats-row">
                            <div class="stat-item">
                                <div class="stat-number">${viewedUser.followers_count || 0}</div>
                                <div class="stat-label">Followers</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">${viewedUser.following_count || 0}</div>
                                <div class="stat-label">Following</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">${stats.points}</div>
                                <div class="stat-label">Points</div>
                            </div>
                        </div>
                        ${canRate ? `<div style="margin:8px 0; font-size:20px;">
                            <span onclick="rateUser(1)" style="cursor:pointer;">☆</span>
                            <span onclick="rateUser(2)" style="cursor:pointer;">☆</span>
                            <span onclick="rateUser(3)" style="cursor:pointer;">☆</span>
                            <span onclick="rateUser(4)" style="cursor:pointer;">☆</span>
                            <span onclick="rateUser(5)" style="cursor:pointer;">☆</span>
                            <span style="font-size:12px; color:#94a3b8; margin-left:8px;">Click to rate</span>
                        </div>` : ''}
                        <div class="btn-group">
                            ${currentUser && currentUser.id !== viewedUser.id ? `
                                <button class="follow-btn ${isFollowing ? 'following' : ''}" id="followBtn" onclick="toggleFollow()">${isFollowing ? '✓ Following' : 'Follow'}</button>
                                <button class="chat-btn" onclick="startChatWithUser(${viewedUser.id})"><i class="fas fa-comment"></i> Chat</button>
                            ` : ''}
                        </div>
                    </div>
                    <div class="info-section">
                        <div class="info-row"><div class="info-icon"><i class="fas fa-envelope"></i></div><div>${escapeHtml(viewedUser.email || "Not provided")}</div></div>
                        <div class="info-row"><div class="info-icon"><i class="fas fa-phone"></i></div><div>${escapeHtml(viewedUser.phone || "Not provided")}</div></div>
                        ${viewedUser.location ? `<div class="info-row"><div class="info-icon"><i class="fas fa-map-marker-alt"></i></div><div>${escapeHtml(viewedUser.location)}</div></div>` : ''}
                        ${roleSpecific}
                        ${viewedUser.bio ? `<div class="info-row"><div class="info-icon"><i class="fas fa-quote-left"></i></div><div>"${escapeHtml(viewedUser.bio)}"</div></div>` : ''}
                        ${viewedUser.verified ? `<div class="info-row"><div class="info-icon"><i class="fas fa-check-circle" style="color:#10b981;"></i></div><div style="color:#10b981;">✅ Verified Contributor</div></div>` : ''}
                    </div>`;
        document.getElementById("profileContent").innerHTML = html;
    }

    async function goBack() {
        if (currentUser?.role === "student") window.location.href = "dashboard-student.html";
        else if (currentUser?.role === "teacher") window.location.href = "dashboard-teacher.html";
        else if (currentUser?.role === "admin") window.location.href = "dashboard-admin.html";
        else if (currentUser?.role === "owner") window.location.href = "dashboard-owner.html";
        else window.location.href = "login.html";
    }

    async function init() {
        try {
            currentUser = await getCurrentUser();
            const urlParams = new URLSearchParams(window.location.search);
            const userId = parseInt(urlParams.get('id'));
            
            if (!userId) {
                document.getElementById("profileContent").innerHTML = `
                    <div style="text-align:center; padding:40px; color:#dc2626;">
                        <i class="fas fa-exclamation-circle" style="font-size:32px; display:block; margin-bottom:12px;"></i>
                        No user ID provided
                    </div>
                `;
                return;
            }
            
            viewedUser = await loadUserProfile(userId);
            if (!viewedUser) { 
                document.getElementById("profileContent").innerHTML = `
                    <div style="text-align:center; padding:40px; color:#dc2626;">
                        <i class="fas fa-exclamation-circle" style="font-size:32px; display:block; margin-bottom:12px;"></i>
                        User not found
                    </div>
                `;
                return; 
            }
            
            await renderProfile();
            document.getElementById("backBtn").onclick = goBack;
            
            if (localStorage.getItem("busahmed_dark_mode") === "true") {
                document.body.classList.add("dark-mode");
            }
            
            // Expose functions globally
            window.rateUser = rateUser;
            window.startChatWithUser = startChatWithUser;
            window.toggleFollow = toggleFollow;
            
        } catch(err) {
            console.error('Init error:', err);
            document.getElementById("profileContent").innerHTML = `
                <div style="text-align:center; padding:40px; color:#dc2626;">
                    <i class="fas fa-exclamation-circle" style="font-size:32px; display:block; margin-bottom:12px;"></i>
                    Error loading profile: ${escapeHtml(err.message)}
                    <br><br>
                    <button onclick="location.reload()" style="background:#4f46e5; color:white; border:none; border-radius:40px; padding:8px 20px; cursor:pointer;">Retry</button>
                </div>
            `;
        }
    }
    init();
</script>
</body>
</html>
