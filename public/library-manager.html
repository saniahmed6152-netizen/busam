    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #1e1b4b, #4f46e5); min-height: 100vh; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .card { background: white; border-radius: 32px; padding: 24px; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.2); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        h1 { font-size: 24px; color: #1e1b4b; display: flex; align-items: center; gap: 10px; }
        .back-btn { background: #e2e8f0; border: none; border-radius: 40px; padding: 8px 20px; cursor: pointer; font-weight: 600; }
        .form-box { background: #f1f5f9; border-radius: 20px; padding: 16px; margin-bottom: 20px; }
        .form-box h3 { margin-bottom: 12px; color: #1e293b; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 40px; margin-bottom: 8px; outline: none; font-size: 14px; transition: 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
        textarea { border-radius: 20px; min-height: 80px; resize: vertical; font-family: inherit; }
        .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; }
        .file-input-wrapper input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        .file-input-wrapper .file-label { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; background: #e2e8f0; border: 2px dashed #cbd5e1; border-radius: 40px; cursor: pointer; transition: 0.2s; color: #64748b; }
        .file-input-wrapper .file-label:hover { background: #eef2ff; border-color: #4f46e5; }
        .dark-mode .file-input-wrapper .file-label { background: #334155; border-color: #475569; color: #94a3b8; }
        .dark-mode .file-input-wrapper .file-label:hover { background: #1e293b; border-color: #4f46e5; }
        .book-item { background: #f8fafc; border-radius: 20px; padding: 14px 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; border-left: 4px solid #4f46e5; transition: 0.2s; }
        .book-item:hover { background: #eef2ff; transform: scale(1.01); }
        .book-cover-preview { width: 60px; height: 80px; object-fit: cover; border-radius: 8px; background: #e2e8f0; flex-shrink: 0; }
        .book-info { flex: 1; min-width: 150px; }
        .book-title { font-weight: 700; font-size: 15px; }
        .book-meta { font-size: 13px; color: #64748b; margin-top: 2px; }
        .btn-delete { background: #ef4444; color: white; border: none; border-radius: 40px; padding: 4px 12px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .btn-delete:hover { background: #dc2626; }
        .btn-move { background: #f59e0b; color: white; border: none; border-radius: 40px; padding: 4px 12px; cursor: pointer; font-size: 12px; margin: 2px; transition: 0.2s; }
        .btn-move:hover { background: #d97706; }
        .position-badge { background: #4f46e5; color: white; padding: 2px 10px; border-radius: 40px; font-size: 11px; font-weight: 600; }
        .btn-add { background: #4f46e5; color: white; border: none; border-radius: 40px; padding: 12px; width: 100%; cursor: pointer; font-weight: 600; font-size: 15px; transition: 0.2s; }
        .btn-add:hover { background: #4338ca; }
        .btn-add:disabled { background: #94a3b8; cursor: not-allowed; }
        .dark-mode { background: #0f172a; }
        .dark-mode .card { background: #1e293b; }
        .dark-mode h1 { color: #f1f5f9; }
        .dark-mode .form-box { background: #0f172a; border: 1px solid #334155; }
        .dark-mode .form-box h3 { color: #e2e8f0; }
        .dark-mode .book-item { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; border-left-color: #4f46e5; }
        .dark-mode .book-item:hover { background: #1e293b; }
        .dark-mode .back-btn { background: #334155; color: #e2e8f0; }
        .dark-mode .back-btn:hover { background: #475569; }
        .dark-mode input, .dark-mode select, .dark-mode textarea { background: #334155; border-color: #475569; color: white; }
        .dark-mode input::placeholder, .dark-mode textarea::placeholder { color: #94a3b8; }
        .dark-mode .book-meta { color: #94a3b8; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 8px 20px; border-radius: 40px; font-size: 14px; z-index: 2000; }
        .empty-state { text-align: center; padding: 40px 20px; color: #94a3b8; }
        .empty-state i { font-size: 40px; display: block; margin-bottom: 12px; opacity: 0.5; }
        .loading-spinner { text-align: center; padding: 40px; color: #94a3b8; }
        .loading-spinner i { font-size: 30px; display: block; margin-bottom: 12px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .dark-mode .empty-state { color: #64748b; }
        .dark-mode .loading-spinner { color: #64748b; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <h1><i class="fas fa-book" style="color:#4f46e5;"></i> Library Manager</h1>
            <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> Back</button>
        </div>
        <div class="form-box">
            <h3>📚 Add New Book</h3>
            <input type="text" id="bookTitle" placeholder="Title *">
            <input type="text" id="bookAuthor" placeholder="Author *">
            <select id="bookCategory">
                <option value="Mathematics">Mathematics</option>
                <option value="English">English</option>
                <option value="Science">Science</option>
                <option value="General">General</option>
                <option value="Programming">Programming</option>
                <option value="Business">Business</option>
            </select>
            <textarea id="bookBio" placeholder="Book Description / Bio *"></textarea>
            <div class="form-row">
                <input type="number" id="bookPrice" placeholder="Price (0 for free)" value="0">
                <input type="number" id="bookPosition" placeholder="Position (1=top)" value="999">
            </div>
            <div class="file-input-wrapper">
                <div class="file-label" id="pdfLabel">
                    <i class="fas fa-file-pdf"></i>
                    <span>Click to upload PDF file *</span>
                    <span id="pdfName" style="font-weight:500; color:#1e293b;"></span>
                </div>
                <input type="file" id="bookFile" accept=".pdf,.PDF,application/pdf">
            </div>
            <div class="file-input-wrapper">
                <div class="file-label" id="coverLabel">
                    <i class="fas fa-image"></i>
                    <span>Click to upload Book Cover</span>
                    <span id="coverName" style="font-weight:500; color:#1e293b;"></span>
                </div>
                <input type="file" id="coverFile" accept="image/*">
            </div>
            <button class="btn-add" id="addBtn"><i class="fas fa-plus"></i> Add Book</button>
        </div>
        <div id="booksList">
            <div class="loading-spinner"><i class="fas fa-spinner"></i> Loading books...</div>
        </div>
    </div>
</div>

<script>
const API_BASE = window.location.origin + '/api/';
    let currentUser = null;
    let books = [];

    function getToken() {
        return localStorage.getItem('busahmed_token');
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    function showToast(msg, isError = false) {
        const t = document.createElement("div");
        t.className = "toast";
        t.innerText = msg;
        if (isError) t.style.background = "#dc2626";
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    function resizeImage(file, maxWidth, callback) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                let width = img.width;
                let height = img.height;
                if (width > maxWidth) { height = (height * maxWidth) / width; width = maxWidth; }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', 0.8));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function readFileAsBase64(file, callback) {
        const reader = new FileReader();
        reader.onload = function(e) {
            callback(e.target.result);
        };
        reader.readAsDataURL(file);
    }

    function goBack() {
        if (currentUser) {
            if (currentUser.role === 'student') window.location.href = 'dashboard-student.html';
            else if (currentUser.role === 'teacher') window.location.href = 'dashboard-teacher.html';
            else if (currentUser.role === 'owner') window.location.href = 'dashboard-owner.html';
            else if (currentUser.role === 'admin') window.location.href = 'dashboard-admin.html';
            else window.location.href = 'login.html';
        } else {
            window.location.href = 'login.html';
        }
    }

    async function checkAuth() {
        const token = getToken();
        if (!token) {
            window.location.href = 'login.html';
            return null;
        }
        try {
            const response = await fetch(API_BASE + 'profile.php?token=' + encodeURIComponent(token));
            if (!response.ok) {
                localStorage.clear();
                window.location.href = 'login.html';
                return null;
            }
            currentUser = await response.json();
            
            const isFullAdmin = currentUser.role === 'admin';
            const isAppointedAndAccepted = currentUser.is_appointed_admin == 1 && currentUser.admin_appointment_status === 'accepted';
            const canManageLibrary = currentUser.can_manage_library == 1;
            
            if (!isFullAdmin && !(isAppointedAndAccepted && canManageLibrary)) {
                showToast('You do not have permission to manage library', true);
                setTimeout(() => {
                    if (currentUser.role === 'student') window.location.href = 'dashboard-student.html';
                    else if (currentUser.role === 'teacher') window.location.href = 'dashboard-teacher.html';
                    else if (currentUser.role === 'owner') window.location.href = 'dashboard-owner.html';
                    else window.location.href = 'login.html';
                }, 2000);
                return null;
            }
            return currentUser;
        } catch(err) {
            console.error("Auth error:", err);
            window.location.href = 'login.html';
            return null;
        }
    }

    async function loadBooks() {
        const token = getToken();
        if (!token) return;
        const container = document.getElementById("booksList");
        container.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner"></i> Loading books...</div>';
        
        try {
            const response = await fetch(API_BASE + 'admin-books.php?token=' + encodeURIComponent(token));
            const data = await response.json();
            if (data.error) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>${escapeHtml(data.error)}</div>`;
                return;
            }
            books = data;
            renderBooks(books);
        } catch(err) {
            console.error('Load books error:', err);
            container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle" style="color:#ef4444;"></i> Error loading books. Please try again.</div>';
        }
    }

    function renderBooks(booksList) {
        const container = document.getElementById("booksList");
        if (!booksList || booksList.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-book"></i>
                    No books added yet.<br>
                    Use the form above to add your first book.
                </div>
            `;
            return;
        }
        
        let html = "";
        booksList.forEach((b) => {
            const coverHtml = b.cover ? 
                `<img src="${b.cover}" class="book-cover-preview">` : 
                `<div class="book-cover-preview" style="display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:24px;"><i class="fas fa-book"></i></div>`;
            
            const positionDisplay = b.position <= 999 ? b.position : '--';
            const priceDisplay = b.is_free ? 'Free' : '₦' + b.price;
            
            html += `
                <div class="book-item">
                    <div style="display:flex; align-items:center; gap:12px; flex:1; min-width:150px;">
                        ${coverHtml}
                        <div class="book-info">
                            <div class="book-title">${escapeHtml(b.title)}</div>
                            <div class="book-meta">${escapeHtml(b.author)} | ${escapeHtml(b.category)}</div>
                            <div class="book-meta">
                                ${priceDisplay} | 
                                Position: <span class="position-badge">${positionDisplay}</span> | 
                                📥 ${b.downloads || 0} downloads
                            </div>
                        </div>
                    </div>
                    <div style="display:flex; gap:4px; flex-wrap:wrap;">
                        <button class="btn-move" onclick="moveBook(${b.id}, -1)" title="Move Up"><i class="fas fa-arrow-up"></i></button>
                        <button class="btn-move" onclick="moveBook(${b.id}, 1)" title="Move Down"><i class="fas fa-arrow-down"></i></button>
                        <button class="btn-delete" data-id="${b.id}"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
        
        document.querySelectorAll(".btn-delete").forEach(btn => {
            btn.onclick = async () => {
                const id = parseInt(btn.dataset.id);
                if (!confirm("Delete this book permanently?")) return;
                const token = getToken();
                try {
                    const response = await fetch(API_BASE + 'delete-book.php?token=' + encodeURIComponent(token), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id })
                    });
                    const data = await response.json();
                    if (data.success) {
                        showToast("Book deleted");
                        loadBooks();
                    } else {
                        showToast(data.error || "Failed to delete", true);
                    }
                } catch(err) {
                    showToast("Error deleting book", true);
                }
            };
        });
    }

    async function moveBook(bookId, direction) {
        const token = getToken();
        try {
            const response = await fetch(API_BASE + 'move-book.php?token=' + encodeURIComponent(token), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: bookId, direction })
            });
            const data = await response.json();
            if (data.success) {
                showToast("Position updated");
                loadBooks();
            } else {
                showToast(data.error || "Failed to move book", true);
            }
        } catch(err) {
            showToast("Failed to move book", true);
        }
    }

    document.getElementById('addBtn').onclick = function() {
        const title = document.getElementById("bookTitle").value.trim();
        const author = document.getElementById("bookAuthor").value.trim();
        const category = document.getElementById("bookCategory").value;
        const price = parseInt(document.getElementById("bookPrice").value) || 0;
        const position = parseInt(document.getElementById("bookPosition").value) || 999;
        const bio = document.getElementById("bookBio").value.trim();
        const file = document.getElementById("bookFile").files[0];
        const coverFile = document.getElementById("coverFile").files[0];

        if (!title || !author) { showToast("Title and author required", true); return; }
        if (!bio) { showToast("Book description is required", true); return; }
        if (!file) { showToast("Select a PDF file", true); return; }

        const btn = this;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adding...';

        let coverData = null;
        const processCover = (callback) => {
            if (coverFile) {
                resizeImage(coverFile, 300, (resized) => {
                    coverData = resized;
                    callback();
                });
            } else {
                callback();
            }
        };

        processCover(() => {
            readFileAsBase64(file, (pdfData) => {
                const token = getToken();
                fetch(API_BASE + 'admin-add-book.php?token=' + encodeURIComponent(token), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        title, author, category, price, 
                        position, bio,
                        pdf_url: pdfData,
                        cover: coverData
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        showToast("✅ Book added successfully!");
                        document.getElementById("bookTitle").value = "";
                        document.getElementById("bookAuthor").value = "";
                        document.getElementById("bookBio").value = "";
                        document.getElementById("bookFile").value = "";
                        document.getElementById("coverFile").value = "";
                        document.getElementById("bookPrice").value = "0";
                        document.getElementById("bookPosition").value = "999";
                        document.getElementById("pdfName").textContent = "";
                        document.getElementById("coverName").textContent = "";
                        loadBooks();
                    } else {
                        showToast(data.error || "Failed to add book", true);
                    }
                })
                .catch(err => showToast("Error: " + err.message, true))
                .finally(() => {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-plus"></i> Add Book';
                });
            });
        });
    };

    // File input handlers
    document.getElementById('bookFile').addEventListener('change', function(e) {
        const file = this.files[0];
        const nameDisplay = document.getElementById('pdfName');
        if (file) {
            nameDisplay.textContent = file.name;
            document.querySelector("#pdfLabel span:not(#pdfName)").textContent = 'Selected:';
        } else {
            nameDisplay.textContent = '';
            document.querySelector("#pdfLabel span:not(#pdfName)").textContent = 'Click to upload PDF file *';
        }
    });

    document.getElementById('coverFile').addEventListener('change', function(e) {
        const file = this.files[0];
        const nameDisplay = document.getElementById('coverName');
        if (file) {
            nameDisplay.textContent = file.name;
            document.querySelector("#coverLabel span:not(#coverName)").textContent = 'Selected:';
        } else {
            nameDisplay.textContent = '';
            document.querySelector("#coverLabel span:not(#coverName)").textContent = 'Click to upload Book Cover';
        }
    });

    async function init() {
        await checkAuth();
        if (!currentUser) return;
        await loadBooks();
        document.getElementById("backBtn").onclick = goBack;
        if (localStorage.getItem("busahmed_dark_mode") === "true") document.body.classList.add("dark-mode");
    }
    init();
</script>
</body>
</html>
