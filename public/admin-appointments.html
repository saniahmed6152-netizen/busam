    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #1e1b4b, #4f46e5); min-height: 100vh; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .card { background: white; border-radius: 32px; padding: 24px; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.2); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        h1 { font-size: 24px; color: #1e1b4b; display: flex; align-items: center; gap: 10px; }
        .back-btn { background: #e2e8f0; border: none; border-radius: 40px; padding: 8px 20px; cursor: pointer; font-weight: 600; }
        .tabs { display: flex; gap: 16px; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; }
        .tab { padding: 10px 0; cursor: pointer; font-weight: 600; transition: 0.2s; color: #64748b; }
        .tab.active { color: #4f46e5; border-bottom: 3px solid #4f46e5; }
        .appointment-card { background: #f8fafc; border-radius: 20px; padding: 16px; margin-bottom: 12px; border-left: 4px solid #4f46e5; }
        .appointment-card .user-info { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .appointment-card .status-badge { padding: 2px 12px; border-radius: 40px; font-size: 11px; font-weight: 600; }
        .status-pending { background: #fef3c7; color: #d97706; }
        .status-accepted { background: #d1fae5; color: #059669; }
        .status-rejected { background: #fee2e2; color: #dc2626; }
        .btn-appoint { background: #4f46e5; color: white; border: none; border-radius: 40px; padding: 6px 16px; cursor: pointer; font-weight: 500; }
        .btn-appoint:hover { background: #4338ca; }
        .btn-remove { background: #ef4444; color: white; border: none; border-radius: 40px; padding: 6px 16px; cursor: pointer; font-weight: 500; }
        .btn-remove:hover { background: #dc2626; }
        .btn-permissions { background: #8b5cf6; color: white; border: none; border-radius: 40px; padding: 6px 16px; cursor: pointer; font-weight: 500; }
        .btn-permissions:hover { background: #7c3aed; }
        .dark-mode { background: #0f172a; }
        .dark-mode .card { background: #1e293b; color: #e2e8f0; }
        .dark-mode .appointment-card { background: #1e293b; border-color: #4f46e5; }
        .dark-mode .back-btn { background: #334155; color: #e2e8f0; }
        .dark-mode .tab { color: #94a3b8; }
        .dark-mode .tab.active { color: #a5b4fc; border-bottom-color: #a5b4fc; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 8px 20px; border-radius: 40px; font-size: 14px; z-index: 2000; }
        .loading-spinner { text-align: center; padding: 40px; color: #94a3b8; }
        .loading-spinner i { font-size: 30px; display: block; margin-bottom: 12px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 40px; color: #94a3b8; }
        .empty-state i { font-size: 40px; display: block; margin-bottom: 12px; opacity: 0.5; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <h1><i class="fas fa-user-plus" style="color:#4f46e5;"></i> Admin Appointments</h1>
            <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> Back</button>
        </div>
        <div class="tabs">
            <div class="tab active" data-tab="appointed">👑 Appointed Admins</div>
            <div class="tab" data-tab="pending">⏳ Pending</div>
            <div class="tab" data-tab="available">👤 Available Users</div>
        </div>
        <div id="appointmentList">
            <div class="loading-spinner"><i class="fas fa-spinner"></i> Loading...</div>
        </div>
    </div>
</div>
<script>
const API_BASE = window.location.origin + '/api/';
    let currentUser = null;

    function showToast(msg, isError = false) {
        const t = document.createElement("div");
        t.className = "toast";
        t.innerText = msg;
        if (isError) t.style.background = "#dc2626";
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    function getToken() {
        return localStorage.getItem('busahmed_token');
    }

    async function checkAuth() {
        const token = getToken();
        if (!token) {
            window.location.href = 'login.html';
            return null;
        }
        try {
            const response = await fetch(API_BASE + 'profile.php?token=' + encodeURIComponent(token));
            if (!response.ok) {
                localStorage.clear();
                window.location.href = 'login.html';
                return null;
            }
            const user = await response.json();
            if (user.role !== 'admin') {
                window.location.href = 'login.html';
                return null;
            }
            currentUser = user;
            return user;
        } catch(err) {
            console.error("Auth error:", err);
            window.location.href = 'login.html';
            return null;
        }
    }

    function goBack() {
        window.location.href = 'dashboard-admin.html';
    }

    let currentTab = 'appointed';

    async function loadAppointments() {
        const token = getToken();
        if (!token) return;
        const container = document.getElementById('appointmentList');
        container.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner"></i> Loading...</div>';

        try {
            const response = await fetch(API_BASE + 'admin-appointments.php?token=' + encodeURIComponent(token));
            const data = await response.json();
            
            if (!data.success) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle" style="color:#ef4444;"></i> Error loading</div>';
                return;
            }

            renderAppointments(data, currentTab);
        } catch(err) {
            console.error('Load error:', err);
            container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle" style="color:#ef4444;"></i> Error loading</div>';
        }
    }

    function renderAppointments(data, tab) {
        const container = document.getElementById('appointmentList');
        let items = [];
        let title = '';

        if (tab === 'appointed') {
            items = data.appointed_admins || [];
            title = 'Appointed Admins';
        } else if (tab === 'pending') {
            items = (data.appointed_admins || []).filter(u => u.admin_appointment_status === 'pending');
            title = 'Pending Appointments';
        } else if (tab === 'available') {
            items = data.available_users || [];
            title = 'Available Users';
        }

        if (!items || items.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i> No ${title.toLowerCase()} found</div>`;
            return;
        }

        let html = '';
        items.forEach(u => {
            const statusClass = u.admin_appointment_status === 'pending' ? 'status-pending' : 
                               u.admin_appointment_status === 'accepted' ? 'status-accepted' : 'status-rejected';
            const statusLabel = u.admin_appointment_status || 'N/A';

            let actions = '';
            
            if (tab === 'appointed') {
                if (u.admin_appointment_status === 'pending') {
                    actions = `<span class="status-badge ${statusClass}">⏳ Pending</span>`;
                } else if (u.admin_appointment_status === 'accepted') {
                    actions = `
                        <span class="status-badge ${statusClass}">✅ Accepted</span>
                        <button class="btn-permissions" onclick="goToPermissions(${u.user_id})"><i class="fas fa-user-cog"></i> Permissions</button>
                        <button class="btn-remove" onclick="removeAdmin(${u.user_id})"><i class="fas fa-user-minus"></i> Remove</button>
                    `;
                } else if (u.admin_appointment_status === 'rejected') {
                    actions = `<span class="status-badge ${statusClass}">❌ Rejected</span>`;
                }
            } else if (tab === 'pending') {
                actions = `<span class="status-badge ${statusClass}">${statusLabel}</span>`;
            } else if (tab === 'available') {
                actions = `<button class="btn-appoint" onclick="appointAdmin(${u.user_id}, '${escapeHtml(u.user_name)}')"><i class="fas fa-user-plus"></i> Appoint</button>`;
            }

            html += `
                <div class="appointment-card">
                    <div class="user-info">
                        <div>
                            <strong>${escapeHtml(u.user_name)}</strong>
                            <br><small style="color:#64748b;">${escapeHtml(u.user_email)}</small>
                            ${u.user_role ? `<br><small style="color:#64748b;">Role: ${escapeHtml(u.user_role)}</small>` : ''}
                            ${u.appointed_by_name ? `<br><small style="color:#64748b;">Appointed by: ${escapeHtml(u.appointed_by_name)}</small>` : ''}
                            ${u.admin_appointment_date ? `<br><small style="color:#64748b;">Date: ${new Date(u.admin_appointment_date).toLocaleDateString()}</small>` : ''}
                            ${u.can_manage_news || u.can_manage_jobs || u.can_manage_careers || u.can_manage_library ? 
                                `<br><small style="color:#8b5cf6;">🔑 Has permissions</small>` : ''}
                        </div>
                        <div>${actions}</div>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // In admin-appointments.html, update this function:
function goToPermissions(userId) {
    if (!userId) {
        showToast('Invalid user ID', true);
        return;
    }
    window.location.href = 'manage-permissions.html?user_id=' + userId;
}

    async function appointAdmin(userId, userName) {
        if (!confirm(`Are you sure you want to appoint ${userName} as an admin? They will need to accept the appointment.`)) return;

        const token = getToken();
        try {
            const response = await fetch(API_BASE + 'admin-appointments.php?token=' + encodeURIComponent(token), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'appoint', user_id: userId })
            });
            const data = await response.json();
            if (data.success) {
                showToast('✅ ' + data.message);
                loadAppointments();
            } else {
                showToast(data.error || 'Failed to appoint', true);
            }
        } catch(err) {
            showToast('Network error', true);
        }
    }

    async function removeAdmin(userId) {
        if (!userId) {
            showToast('Invalid user ID', true);
            return;
        }
        
        if (!confirm('Are you sure you want to remove this user from admin appointment? All permissions will be revoked.')) return;

        const token = getToken();
        try {
            const response = await fetch(API_BASE + 'admin-appointments.php?token=' + encodeURIComponent(token), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    action: 'remove', 
                    user_id: userId 
                })
            });
            const data = await response.json();
            if (data.success) {
                showToast('✅ ' + data.message);
                loadAppointments();
            } else {
                showToast(data.error || 'Failed to remove', true);
            }
        } catch(err) {
            console.error('Remove error:', err);
            showToast('Network error', true);
        }
    }

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
        tab.onclick = function() {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            currentTab = this.dataset.tab;
            loadAppointments();
        };
    });

    async function init() {
        await checkAuth();
        if (!currentUser) return;
        loadAppointments();
        document.querySelector('.back-btn').onclick = goBack;
        if (localStorage.getItem('busahmed_dark_mode') === 'true') document.body.classList.add('dark-mode');
    }
    init();
</script>
</body>
