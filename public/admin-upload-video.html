        body { background: linear-gradient(135deg, #1e1b4b, #4f46e5); min-height: 100vh; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }

        .form-group input, .form-group textarea {

            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);

        /* Remove any restriction on spaces */
        .form-group input[type="text"] {
            -webkit-user-select: text;
            user-select: text;

        .form-group .file-input-wrapper .file-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;

            border: 2px dashed #cbd5e1;
            border-radius: 20px;

            border-radius: 40px; 
            padding: 14px 24px; 
            cursor: pointer; 
            font-size: 16px;

            display: none;
            background: #e2e8f0;
            border-radius: 40px;

            margin: 12px 0;

        .progress-bar .progress-fill {
            width: 0%;
            height: 100%;
            background: #4f46e5;
            transition: 0.3s;
            border-radius: 40px;

            text-align: center;

            display: block;

<body>
<div class="container">
    <div class="card">
        <div class="header">
            <h1><i class="fas fa-video" style="color:#4f46e5;"></i> Upload Video</h1>
            <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> Back</button>
        </div>
        
        <div class="info-box">
            <h4><i class="fas fa-crown" style="color:#4f46e5;"></i> Admin Upload</h4>
            <p>As an admin, your videos are <strong>auto-approved</strong> and published immediately!</p>
            <ul>
                <li>📁 Max file size: <strong>1GB</strong></li>
                <li>⏱️ Max duration: <strong>30 minutes</strong></li>
                <li>✅ Auto-approved - No waiting!</li>
                <li>👑 Videos show "Admin" badge</li>
            </ul>
        </div>
        
        <div class="upload-form">
            <div class="form-group">
                <label><i class="fas fa-tag"></i> Video Title *</label>
                <input type="text" id="videoTitle" placeholder="Enter video title..." autocomplete="off" spellcheck="true">
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-hashtag"></i> Tags (comma separated)</label>
                <input type="text" id="videoTags" placeholder="e.g., tutorial, education, technology" autocomplete="off" spellcheck="true">
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-align-left"></i> Description</label>
                <textarea id="videoDescription" placeholder="Describe your video..."></textarea>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-file-video"></i> Select Video File *</label>
                <div class="file-input-wrapper">
                    <div class="file-label" id="fileLabel">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span>Click to select video file</span>
                        <span class="file-name" id="fileName"></span>
                    </div>
                    <input type="file" id="videoFile" accept="video/*,.mp4,.mov,.avi,.webm,.mkv,.3gp,.flv,.wmv,.mpeg">
                </div>
                <div class="preview-container" id="previewContainer">
                    <video id="videoPreview" controls></video>
                </div>
            </div>
            
            <div class="progress-bar" id="uploadProgress">
                <div class="progress-fill" id="progressBar"></div>
            </div>
            
            <div class="upload-status" id="uploadStatus"></div>
            
            <button class="upload-btn" id="submitBtn">
                <i class="fas fa-upload"></i> Publish Video
            </button>
        </div>
    </div>
</div>

<script>
const API_BASE = window.location.origin + '/api/';
let currentUser = null;

function getToken() {
    return localStorage.getItem('busahmed_token');
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
}

function showToast(msg, isError = false) {
    const t = document.createElement("div");
    t.className = "toast";
    t.innerText = msg;
    if (isError) t.style.background = "#dc2626";
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

async function checkAuth() {
    const token = getToken();
    if (!token) {
        window.location.href = 'login.html';
        return null;
    }
    try {
        const response = await fetch(API_BASE + 'profile.php?token=' + encodeURIComponent(token));
        if (!response.ok) {
            localStorage.clear();
            window.location.href = 'login.html';
            return null;
        }
        currentUser = await response.json();
        if (currentUser.role !== 'admin') {
            showToast('Only admins can access this page', true);
            setTimeout(() => window.location.href = 'dashboard-admin.html', 2000);
            return null;
        }
        return currentUser;
    } catch(err) {
        console.error("Auth error:", err);
        window.location.href = 'login.html';
        return null;
    }
}

function goBack() {
    window.location.href = 'dashboard-admin.html';
}

// ==================== FILE PREVIEW ====================
document.getElementById('videoFile').addEventListener('change', function(e) {
    const file = this.files[0];
    const fileName = document.getElementById('fileName');
    const previewContainer = document.getElementById('previewContainer');
    const videoPreview = document.getElementById('videoPreview');
    
    if (file) {
        fileName.textContent = file.name;
        document.querySelector('.file-label span:not(.file-name)').textContent = 'Selected:';
        
        // Preview video
        const url = URL.createObjectURL(file);
        videoPreview.src = url;
        previewContainer.style.display = 'block';
        
        // Check duration if possible
        videoPreview.onloadedmetadata = function() {
            const duration = Math.round(this.duration);
            const mins = Math.floor(duration / 60);
            const secs = duration % 60;
            const durationText = mins + ':' + String(secs).padStart(2, '0');
            fileName.textContent += ' (' + durationText + ')';
        };
    } else {
        fileName.textContent = '';
        document.querySelector('.file-label span:not(.file-name)').textContent = 'Click to select video file';
        previewContainer.style.display = 'none';
        videoPreview.src = '';
    }
});

// ==================== UPLOAD VIDEO ====================
document.getElementById('submitBtn').onclick = async function() {
    const title = document.getElementById('videoTitle').value.trim();
    const tags = document.getElementById('videoTags').value.trim();
    const description = document.getElementById('videoDescription').value.trim();
    const file = document.getElementById('videoFile').files[0];
    
    if (!file) {
        showToast('Please select a video file', true);
        return;
    }
    
    if (!title) {
        showToast('Please enter a video title', true);
        document.getElementById('videoTitle').focus();
        return;
    }
    
    const btn = this;
    const progressDiv = document.getElementById('uploadProgress');
    const statusDiv = document.getElementById('uploadStatus');
    
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
    progressDiv.style.display = 'block';
    statusDiv.className = 'upload-status';
    statusDiv.style.display = 'none';
    
    const formData = new FormData();
    formData.append('video', file);
    formData.append('title', title);
    formData.append('description', description);
    formData.append('tags', tags);
    
    const token = getToken();
    
    try {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', API_BASE + 'upload-video.php?token=' + encodeURIComponent(token));
        
        xhr.upload.onprogress = function(e) {
            if (e.lengthComputable) {
                const percent = Math.round((e.loaded / e.total) * 100);
                document.getElementById('progressBar').style.width = percent + '%';
            }
        };
        
        xhr.onload = function() {
            try {
                const data = JSON.parse(xhr.responseText);
                
                if (data.success) {
                    statusDiv.className = 'upload-status success';
                    statusDiv.style.display = 'block';
                    statusDiv.innerHTML = `
                        <span class="status-icon">✅</span>
                        <strong>${data.message}</strong>
                        ${data.video_url ? `<br><small style="font-size:12px;">Video URL: ${escapeHtml(data.video_url)}</small>` : ''}
                        ${data.status === 'approved' ? '<br><span style="font-size:13px; color:#059669;">📢 Video is now live on the feed!</span>' : ''}
                    `;
                    showToast('✅ Video published successfully!');
                    
                    setTimeout(() => {
                        document.getElementById('videoTitle').value = '';
                        document.getElementById('videoTags').value = '';
                        document.getElementById('videoDescription').value = '';
                        document.getElementById('videoFile').value = '';
                        document.getElementById('fileName').textContent = '';
                        document.getElementById('previewContainer').style.display = 'none';
                        document.getElementById('videoPreview').src = '';
                        document.getElementById('progressBar').style.width = '0%';
                        progressDiv.style.display = 'none';
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-upload"></i> Publish Video';
                        document.querySelector('.file-label span:not(.file-name)').textContent = 'Click to select video file';
                        
                        setTimeout(() => {
                            if (confirm('Video published! Would you like to view it on the feed?')) {
                                window.location.href = 'videos.html';
                            }
                        }, 1000);
                    }, 3000);
                } else {
                    statusDiv.className = 'upload-status error';
                    statusDiv.style.display = 'block';
                    statusDiv.innerHTML = `
                        <span class="status-icon">❌</span>
                        ${escapeHtml(data.error || 'Upload failed')}
                    `;
                    showToast(data.error || 'Upload failed', true);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-upload"></i> Publish Video';
                }
            } catch (e) {
                console.error('Parse error:', e, 'Response:', xhr.responseText);
                statusDiv.className = 'upload-status error';
                statusDiv.style.display = 'block';
                statusDiv.innerHTML = `
                    <span class="status-icon">❌</span>
                    Error processing response
                `;
                showToast('Error processing response', true);
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-upload"></i> Publish Video';
            }
        };
        
        xhr.onerror = function() {
            statusDiv.className = 'upload-status error';
            statusDiv.style.display = 'block';
            statusDiv.innerHTML = `
                <span class="status-icon">❌</span>
                Network error. Please check your internet connection.
            `;
            showToast('Network error. Please try again.', true);
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-upload"></i> Publish Video';
            progressDiv.style.display = 'none';
        };
        
        xhr.send(formData);
        
    } catch(err) {
        console.error('Upload error:', err);
        showToast('Error uploading video', true);
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-upload"></i> Publish Video';
        progressDiv.style.display = 'none';
    }
};

// Add event listener to prevent any key blocking
document.getElementById('videoTitle').addEventListener('keydown', function(e) {
    // Allow all keys including space
    return true;
});

async function init() {
    await checkAuth();
    if (!currentUser) return;
    
    document.getElementById('backBtn').onclick = goBack;
    
    if (localStorage.getItem("busahmed_dark_mode") === "true") {
        document.body.classList.add("dark-mode");
    }
}

init();
</script>
</body>
