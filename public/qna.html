<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #1e1b4b, #4f46e5); min-height: 100vh; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .card { background: white; border-radius: 32px; padding: 24px; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.2); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        h1 { font-size: 24px; color: #1e1b4b; display: flex; align-items: center; gap: 10px; }
        .back-btn { background: #e2e8f0; border: none; border-radius: 40px; padding: 8px 20px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .back-btn:hover { background: #cbd5e1; }
        .ask-btn { background: #4f46e5; color: white; border: none; border-radius: 40px; padding: 10px 20px; cursor: pointer; font-weight: 600; margin-bottom: 20px; width: 100%; transition: 0.2s; }
        .ask-btn:hover { background: #4338ca; }
        .ad-space { margin: 0 0 16px 0; border-radius: 20px; overflow: hidden; height: 80px; display: flex; align-items: center; justify-content: center; position: relative; background: #f1f5f9; }
        
        .question-card { 
            background: #f8fafc; 
            border-radius: 20px; 
            padding: 16px; 
            margin-bottom: 16px; 
            cursor: pointer; 
            transition: 0.2s; 
            border: 1px solid #e2e8f0; 
        }
        .question-card:hover { 
            transform: scale(1.01); 
            background: #eef2ff; 
        }
        .question-card .q-title { 
            font-weight: 700; 
            font-size: 18px; 
            margin-bottom: 4px; 
            color: #1e1b4b;
        }
        .question-card .q-meta { 
            font-size: 12px; 
            color: #94a3b8; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            flex-wrap: wrap; 
        }
        .question-card .q-meta .q-user { 
            color: #4f46e5; 
            font-weight: 600; 
            cursor: pointer; 
        }
        .question-card .q-meta .q-user:hover { 
            text-decoration: underline; 
        }
        .question-card .q-preview { 
            font-size: 14px; 
            color: #64748b; 
            margin-top: 8px; 
            display: -webkit-box; 
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical; 
            overflow: hidden; 
        }
        .question-card .q-image { 
            width: 100%; 
            max-height: 150px; 
            object-fit: cover; 
            border-radius: 12px; 
            margin-top: 8px; 
        }
        .question-card .q-stats { 
            margin-top: 10px; 
            display: flex; 
            gap: 16px; 
            font-size: 13px; 
            color: #64748b; 
        }
        .question-card .q-stats i { 
            margin-right: 4px; 
        }
        .question-card .q-stats .liked { 
            color: #ef4444; 
        }
        
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        .page-btn { background: #e2e8f0; border: none; border-radius: 40px; padding: 6px 14px; cursor: pointer; font-weight: 500; }
        .page-btn.active { background: #4f46e5; color: white; }
        
        .dark-mode { background: #0f172a; }
        .dark-mode .card { background: #1e293b; }
        .dark-mode .question-card { background: #1e293b; border-color: #334155; color: #e2e8f0; }
        .dark-mode .question-card:hover { background: #334155; }
        .dark-mode .question-card .q-title { color: #f1f5f9; }
        .dark-mode .question-card .q-preview { color: #94a3b8; }
        .dark-mode .question-card .q-meta { color: #64748b; }
        .dark-mode .question-card .q-stats { color: #94a3b8; }
        .dark-mode .back-btn { background: #334155; color: #e2e8f0; }
        .dark-mode .page-btn { background: #334155; color: #e2e8f0; }
        .dark-mode .page-btn.active { background: #4f46e5; }
        .dark-mode .ad-space { background: #0f172a; }
        
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 8px 20px; border-radius: 40px; font-size: 14px; z-index: 2000; }
        
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { 
            background: white; 
            border-radius: 32px; 
            max-width: 600px; 
            width: 100%; 
            max-height: 90vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        .dark-mode .modal-content { background: #1e293b; color: #e2e8f0; }
        
        .modal-header { 
            padding: 20px 24px; 
            border-bottom: 1px solid #e2e8f0; 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            flex-shrink: 0; 
        }
        .modal-header h3 { 
            font-size: 18px; 
            color: #1e1b4b; 
            margin-right: 12px; 
            font-weight: 700;
        }
        .dark-mode .modal-header h3 { color: #f1f5f9; }
        .modal-header .close-modal { 
            background: none; 
            border: none; 
            font-size: 24px; 
            cursor: pointer; 
            color: #94a3b8; 
            padding: 0 4px; 
        }
        .modal-header .close-modal:hover { color: #1e293b; }
        .dark-mode .modal-header .close-modal:hover { color: #e2e8f0; }
        .modal-header .modal-meta { 
            font-size: 12px; 
            color: #94a3b8; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-top: 4px; 
        }
        .modal-header .modal-meta .q-user { 
            color: #4f46e5; 
            font-weight: 600; 
            cursor: pointer; 
        }
        .modal-header .modal-meta .q-user:hover { 
            text-decoration: underline; 
        }
        
        .modal-body { 
            padding: 20px 24px; 
            overflow-y: auto; 
            flex: 1; 
        }
        .modal-body .q-content { 
            line-height: 1.8; 
            color: #1e293b; 
            font-size: 15px; 
            margin-bottom: 16px; 
        }
        .dark-mode .modal-body .q-content { color: #e2e8f0; }
        .modal-body .q-image-modal { 
            width: 100%; 
            max-height: 250px; 
            object-fit: cover; 
            border-radius: 12px; 
            margin-bottom: 16px; 
        }
        .modal-body .q-stats-modal { 
            display: flex; 
            gap: 16px; 
            font-size: 13px; 
            color: #64748b; 
            margin-bottom: 16px; 
            padding-bottom: 16px; 
            border-bottom: 1px solid #e2e8f0; 
        }
        .dark-mode .modal-body .q-stats-modal { 
            border-color: #334155; 
            color: #94a3b8; 
        }
        .modal-body .q-stats-modal .liked { color: #ef4444; }
        .modal-body .q-stats-modal i { cursor: pointer; }
        
        .modal-body .answers-section h4 { 
            font-size: 14px; 
            color: #64748b; 
            margin-bottom: 12px; 
        }
        .dark-mode .modal-body .answers-section h4 { color: #94a3b8; }
        
        .modal-body .answers-section .answer-item { 
            background: #f8fafc; 
            border-radius: 16px; 
            padding: 12px 16px; 
            margin-bottom: 12px; 
            border-left: 3px solid #10b981; 
        }
        .dark-mode .modal-body .answers-section .answer-item { 
            background: #0f172a; 
            border-color: #10b981; 
        }
        .modal-body .answers-section .answer-item .a-user { 
            font-weight: 600; 
            font-size: 13px; 
            color: #4f46e5; 
            cursor: pointer; 
        }
        .modal-body .answers-section .answer-item .a-user:hover { 
            text-decoration: underline; 
        }
        .modal-body .answers-section .answer-item .a-content { 
            font-size: 14px; 
            color: #1e293b; 
            margin-top: 4px; 
        }
        .dark-mode .modal-body .answers-section .answer-item .a-content { 
            color: #e2e8f0; 
        }
        .modal-body .answers-section .answer-item .a-meta { 
            font-size: 11px; 
            color: #94a3b8; 
            margin-top: 4px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }
        .modal-body .answers-section .answer-item .a-meta .a-like { 
            cursor: pointer; 
        }
        .modal-body .answers-section .answer-item .a-meta .a-like.liked { 
            color: #ef4444; 
        }
        .modal-body .answers-section .answer-item .a-meta .a-like:hover { 
            opacity: 0.7; 
        }
        .empty-answers { 
            text-align: center; 
            color: #94a3b8; 
            padding: 20px 0; 
            font-size: 14px; 
        }
        
        .modal-footer { 
            padding: 16px 24px; 
            border-top: 1px solid #e2e8f0; 
            flex-shrink: 0; 
        }
        .dark-mode .modal-footer { border-color: #334155; }
        .modal-footer .answer-input { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
        }
        .modal-footer .answer-input textarea { 
            flex: 1; 
            padding: 10px 16px; 
            border: 1px solid #e2e8f0; 
            border-radius: 40px; 
            outline: none; 
            resize: none; 
            font-size: 14px; 
            min-height: 44px; 
            max-height: 100px; 
            font-family: inherit; 
        }
        .dark-mode .modal-footer .answer-input textarea { 
            background: #334155; 
            border-color: #475569; 
            color: white; 
        }
        .modal-footer .answer-input textarea:focus { 
            border-color: #4f46e5; 
        }
        .modal-footer .answer-input button { 
            background: #4f46e5; 
            color: white; 
            border: none; 
            border-radius: 40px; 
            padding: 8px 20px; 
            cursor: pointer; 
            font-weight: 600; 
            white-space: nowrap; 
            transition: 0.2s; 
        }
        .modal-footer .answer-input button:hover { 
            background: #4338ca; 
        }
        .modal-footer .answer-input button:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
        }
        
        .ask-modal {
            max-width: 500px !important;
            padding: 28px !important;
            border-radius: 32px !important;
        }
        .ask-modal .modal-title {
            font-size: 22px;
            font-weight: 700;
            color: #1e1b4b;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dark-mode .ask-modal .modal-title { color: #f1f5f9; }
        .ask-modal input[type="text"],
        .ask-modal textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            margin-bottom: 14px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }
        .ask-modal textarea {
            border-radius: 20px;
            min-height: 120px;
            resize: vertical;
        }
        .ask-modal input[type="text"]:focus,
        .ask-modal textarea:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }
        .dark-mode .ask-modal input[type="text"],
        .dark-mode .ask-modal textarea {
            background: #334155;
            border-color: #475569;
            color: white;
        }
        .dark-mode .ask-modal input[type="text"]::placeholder,
        .dark-mode .ask-modal textarea::placeholder {
            color: #94a3b8;
        }
        .ask-modal .file-upload-wrapper {
            position: relative;
            margin-bottom: 14px;
        }
        .ask-modal .file-upload-wrapper input[type="file"] {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            cursor: pointer;
            font-size: 14px;
        }
        .dark-mode .ask-modal .file-upload-wrapper input[type="file"] {
            background: #334155;
            border-color: #475569;
            color: white;
        }
        .ask-modal .btn-submit {
            width: 100%;
            padding: 14px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .ask-modal .btn-submit:hover { background: #4338ca; }
        .ask-modal .btn-cancel {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: #e2e8f0;
            color: #1e293b;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .ask-modal .btn-cancel:hover { background: #cbd5e1; }
        .dark-mode .ask-modal .btn-cancel {
            background: #334155;
            color: #e2e8f0;
        }
        .dark-mode .ask-modal .btn-cancel:hover { background: #475569; }
        
        @media (max-width: 600px) {
            .modal-content { max-width: 100%; margin: 10px; max-height: 95vh; }
            .modal-footer .answer-input { flex-direction: column; }
            .modal-footer .answer-input textarea { width: 100%; min-height: 60px; }
            .modal-footer .answer-input button { width: 100%; }
            .ask-modal { padding: 20px !important; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <h1><i class="fas fa-question-circle" style="color:#4f46e5;"></i> Q&A Board</h1>
            <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> Back</button>
        </div>
        <button class="ask-btn" id="askBtn"><i class="fas fa-plus"></i> Ask a Question</button>
        <div id="adContainer" class="ad-space">📢 Loading ad...</div>
        <div id="qnaList"></div>
        <div id="paginationControls" class="pagination"></div>
    </div>
</div>

<!-- Question Detail Modal -->
<div class="modal" id="questionModal">
    <div class="modal-content">
        <div class="modal-header">
            <div>
                <h3 id="modalQuestionTitle">Question Title</h3>
                <div class="modal-meta">
                    <span>By <span class="q-user" id="modalQUser">User</span></span>
                    <span id="modalQDate">Date</span>
                </div>
            </div>
            <button class="close-modal" onclick="closeQuestionModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody">
            <div id="modalQImageContainer"></div>
            <div class="q-content" id="modalQContent">Question content here...</div>
            <div class="q-stats-modal">
                <span><i class="fas fa-heart" id="modalLikeIcon" style="cursor:pointer;"></i> <span id="modalLikeCount">0</span></span>
                <span><i class="fas fa-comment"></i> <span id="modalAnswerCount">0</span> answers</span>
            </div>
            <div class="answers-section">
                <h4 id="answersTitle">Answers</h4>
                <div id="answersList"></div>
            </div>
        </div>
        <div class="modal-footer">
            <div class="answer-input">
                <textarea id="answerText" placeholder="Write your answer..." rows="1"></textarea>
                <button id="submitAnswerBtn">Post Answer</button>
            </div>
        </div>
    </div>
</div>

<script>
const API_BASE = window.location.origin + '/api/';
    let currentUser = null;
    let allQuestions = [];
    let currentPage = 1;
    const itemsPerPage = 10;
    let adInterval = null;
    let currentQuestionId = null;

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    function showToast(msg, isError = false) {
        const t = document.createElement("div");
        t.className = "toast";
        t.innerText = msg;
        if (isError) t.style.background = "#dc2626";
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    // ==================== AD HELPER ====================
    function renderAd(containerId, location, intervalTime = 10000) {
        const container = document.getElementById(containerId);
        if (!container) return;
        
        if (adInterval) {
            clearInterval(adInterval);
            adInterval = null;
        }
        
        container.innerHTML = "📢 Loading ad...";
        container.style.cssText = `
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            cursor: default;
            color: #94a3b8;
            font-size: 14px;
        `;
        
        fetch(`${API_BASE}ads.php?location=${location}`)
            .then(response => response.json())
            .then(ads => {
                if (!ads || ads.length === 0) {
                    container.innerHTML = "📢 Ad space - Promote your school";
                    container.style.cssText = `
                        background: #f1f5f9;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        height: 80px;
                        border-radius: 20px;
                        overflow: hidden;
                        position: relative;
                        cursor: default;
                        color: #94a3b8;
                        font-size: 14px;
                    `;
                    return;
                }
                
                let idx = 0;
                
                function showAd() {
                    const ad = ads[idx % ads.length];
                    const imageUrl = ad.image_url || 'https://via.placeholder.com/800x100/4f46e5/ffffff?text=Ad';
                    const linkUrl = ad.link || '#';
                    
                    container.innerHTML = `
                        <img src="${imageUrl}" 
                             style="width:100%; height:80px; object-fit:cover; display:block;" 
                             onerror="this.style.display='none';this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:80px;background:#1e293b;color:#94a3b8;font-size:14px;\\'>📢 Ad</div>'">
                        <div style="position:absolute; bottom:4px; right:8px; background:rgba(0,0,0,0.6); color:white; font-size:10px; padding:2px 10px; border-radius:20px;">
                            ${ad.caption || "Sponsored"} | 👁️ ${ad.views || 0}
                        </div>
                    `;
                    container.style.cssText = `
                        background: transparent;
                        display: block;
                        height: 80px;
                        border-radius: 20px;
                        overflow: hidden;
                        position: relative;
                        cursor: pointer;
                        padding: 0;
                    `;
                    container.onclick = function(e) {
                        e.preventDefault();
                        if (linkUrl && linkUrl !== '#') {
                            window.open(linkUrl, "_blank");
                        }
                    };
                    idx++;
                }
                
                showAd();
                
                if (ads.length > 1) {
                    adInterval = setInterval(showAd, intervalTime);
                }
            })
            .catch(err => {
                console.error("Ad error:", err);
                container.innerHTML = "📢 Ad unavailable";
                container.style.cssText = `
                    background: #f1f5f9;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    height: 80px;
                    border-radius: 20px;
                    overflow: hidden;
                    position: relative;
                    cursor: default;
                    color: #94a3b8;
                    font-size: 14px;
                `;
            });
    }
    // =============================================

    async function checkAuth() {
        const token = localStorage.getItem('busahmed_token');
        if (!token) return null;
        try {
            const response = await fetch(API_BASE + 'profile.php?token=' + encodeURIComponent(token));
            if (!response.ok) return null;
            return await response.json();
        } catch(err) { return null; }
    }

    async function goBack() {
        const user = await checkAuth();
        if (user) {
            if (user.role === 'student') window.location.href = 'dashboard-student.html';
            else if (user.role === 'teacher') window.location.href = 'dashboard-teacher.html';
            else if (user.role === 'admin') window.location.href = 'dashboard-admin.html';
            else if (user.role === 'owner') window.location.href = 'dashboard-owner.html';
            else window.location.href = 'login.html';
        } else { window.location.href = 'login.html'; }
    }

    function viewUserProfile(userId) {
        if (userId) {
            window.location.href = 'view-profile.html?id=' + userId;
        }
    }

    // ==================== RENDER QUESTIONS ====================
    async function renderQuestions() {
        try {
            const response = await fetch(API_BASE + 'questions.php');
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            let questions = await response.json();
            
            if (questions.error) {
                console.error('API Error:', questions.error);
                document.getElementById("qnaList").innerHTML = "<p style='text-align:center; padding:40px; color:#dc2626;'>Error loading questions: " + escapeHtml(questions.error) + "</p>";
                return;
            }
            
            if (!Array.isArray(questions)) {
                console.error('Invalid questions data:', questions);
                document.getElementById("qnaList").innerHTML = "<p style='text-align:center; padding:40px; color:#dc2626;'>Invalid data received</p>";
                return;
            }
            
            questions = questions.map(q => {
                if (typeof q.answers === 'string') q.answers = JSON.parse(q.answers);
                if (typeof q.liked_by === 'string') q.liked_by = JSON.parse(q.liked_by);
                return q;
            });
            
            allQuestions = questions;
            console.log('✅ Questions loaded:', allQuestions.length);
            
            if (allQuestions.length === 0) {
                document.getElementById("qnaList").innerHTML = "<p style='text-align:center; padding:40px; color:#94a3b8;'>No questions yet. Be the first to ask!</p>";
                document.getElementById("paginationControls").innerHTML = '';
                return;
            }
            
            const totalPages = Math.ceil(allQuestions.length / itemsPerPage);
            const start = (currentPage - 1) * itemsPerPage;
            const pageQuestions = allQuestions.slice(start, start + itemsPerPage);
            
            let html = "";
            pageQuestions.forEach(q => {
                const isLiked = q.liked_by?.includes(currentUser?.id);
                const answerCount = q.answers?.length || 0;
                const preview = q.content.length > 120 ? q.content.substring(0, 120) + '...' : q.content;
                const imageHtml = q.image ? `<img src="${q.image}" class="q-image">` : '';
                
                html += `
                    <div class="question-card" onclick="openQuestionModal(${q.id})">
                        <div class="q-title">${escapeHtml(q.title)}</div>
                        <div class="q-meta">
                            <span>By <span class="q-user" onclick="event.stopPropagation();viewUserProfile(${q.asked_by})">${escapeHtml(q.asked_by_name)}</span></span>
                            <span>${new Date(q.created_at).toLocaleDateString()}</span>
                        </div>
                        ${imageHtml}
                        <div class="q-preview">${escapeHtml(preview)}</div>
                        <div class="q-stats">
                            <span><i class="fas fa-heart ${isLiked ? 'liked' : ''}"></i> ${q.upvotes || 0}</span>
                            <span><i class="fas fa-comment"></i> ${answerCount}</span>
                        </div>
                    </div>
                `;
            });
            document.getElementById("qnaList").innerHTML = html;
            
            let paginationHtml = "";
            if (totalPages > 1) {
                if (currentPage > 1) paginationHtml += `<button class="page-btn" data-page="${currentPage - 1}">← Previous</button>`;
                for (let i = 1; i <= totalPages; i++) {
                    if (i === currentPage) paginationHtml += `<button class="page-btn active" data-page="${i}">${i}</button>`;
                    else if (Math.abs(i - currentPage) <= 2 || i === 1 || i === totalPages) {
                        paginationHtml += `<button class="page-btn" data-page="${i}">${i}</button>`;
                    } else if (i === currentPage - 3 || i === currentPage + 3) {
                        paginationHtml += `<span style="margin:0 4px;">...</span>`;
                    }
                }
                if (currentPage < totalPages) paginationHtml += `<button class="page-btn" data-page="${currentPage + 1}">Next →</button>`;
            }
            document.getElementById("paginationControls").innerHTML = paginationHtml;
            
            document.querySelectorAll(".page-btn").forEach(btn => {
                btn.onclick = () => {
                    currentPage = parseInt(btn.dataset.page);
                    renderQuestions();
                    window.scrollTo(0, 0);
                };
            });
            
        } catch(err) {
            console.error('Render questions error:', err);
            document.getElementById("qnaList").innerHTML = "<p style='text-align:center; padding:40px; color:#dc2626;'>Error loading questions. Please refresh.</p>";
        }
    }

    // ==================== QUESTION MODAL ====================
    function openQuestionModal(questionId) {
        // Convert to number if it's a string
        const id = typeof questionId === 'string' ? parseInt(questionId) : questionId;
        
        console.log('🔍 Opening question ID:', questionId, 'converted to:', id);
        console.log('📚 All questions count:', allQuestions.length);
        console.log('📚 All question IDs:', allQuestions.map(q => q.id));
        
        currentQuestionId = id;
        
        // Try to find using strict equality first
        let question = allQuestions.find(q => q.id === id);
        
        // If not found, try with loose equality
        if (!question) {
            question = allQuestions.find(q => q.id == id);
        }
        
        // If still not found, try finding by string conversion
        if (!question) {
            question = allQuestions.find(q => String(q.id) === String(id));
        }
        
        console.log('🔎 Found question:', question);
        
        if (!question) {
            console.error('❌ Question not found! Available IDs:', allQuestions.map(q => q.id));
            showToast('Question not found. Please refresh the page.', true);
            return;
        }
        
        const modal = document.getElementById('questionModal');
        document.getElementById('modalQuestionTitle').textContent = question.title || 'Untitled';
        document.getElementById('modalQUser').textContent = question.asked_by_name || 'Unknown';
        document.getElementById('modalQUser').setAttribute('onclick', `viewUserProfile(${question.asked_by})`);
        document.getElementById('modalQDate').textContent = question.created_at ? new Date(question.created_at).toLocaleDateString() : 'Recent';
        document.getElementById('modalQContent').textContent = question.content || 'No content';
        
        // Image
        const imageContainer = document.getElementById('modalQImageContainer');
        if (question.image && question.image !== 'null' && question.image !== '') {
            imageContainer.innerHTML = `<img src="${question.image}" class="q-image-modal" onerror="this.style.display='none'">`;
        } else {
            imageContainer.innerHTML = '';
        }
        
        // Stats
        const isLiked = question.liked_by?.includes(currentUser?.id);
        document.getElementById('modalLikeIcon').className = `fas fa-heart${isLiked ? ' liked' : ''}`;
        document.getElementById('modalLikeIcon').onclick = () => toggleLike('question', question.id);
        document.getElementById('modalLikeCount').textContent = question.upvotes || 0;
        document.getElementById('modalAnswerCount').textContent = question.answers?.length || 0;
        
        // Render answers
        renderAnswers(question);
        
        // Clear and focus answer input
        document.getElementById('answerText').value = '';
        setTimeout(() => {
            document.getElementById('answerText').focus();
        }, 300);
        
        modal.classList.add('active');
    }

    function closeQuestionModal() {
        document.getElementById('questionModal').classList.remove('active');
        currentQuestionId = null;
    }

    // Close modal on outside click
    document.getElementById('questionModal').addEventListener('click', function(e) {
        if (e.target === this) closeQuestionModal();
    });

    // ESC key to close
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && document.getElementById('questionModal').classList.contains('active')) {
            closeQuestionModal();
        }
    });

    function renderAnswers(question) {
        const container = document.getElementById('answersList');
        const answers = question.answers || [];
        const title = document.getElementById('answersTitle');
        title.textContent = answers.length === 0 ? 'No answers yet' : answers.length + ' Answers';
        
        if (answers.length === 0) {
            container.innerHTML = '<div class="empty-answers">Be the first to answer this question!</div>';
            return;
        }
        
        let html = '';
        answers.forEach(a => {
            const isLiked = a.likedBy?.includes(currentUser?.id);
            html += `
                <div class="answer-item">
                    <div class="a-user" onclick="viewUserProfile(${a.answeredBy})">${escapeHtml(a.answeredByName || 'Unknown')}</div>
                    <div class="a-content">${escapeHtml(a.content)}</div>
                    <div class="a-meta">
                        <span>${new Date(a.createdAt || Date.now()).toLocaleDateString()}</span>
                        <span class="a-like ${isLiked ? 'liked' : ''}" onclick="toggleLike('answer', ${question.id}, ${a.id})">
                            <i class="fas fa-heart"></i> ${a.upvotes || 0}
                        </span>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // ==================== LIKE FUNCTION ====================
    async function toggleLike(type, questionId, answerId = null) {
        const token = localStorage.getItem('busahmed_token');
        if (!token) {
            showToast('Please login to like', true);
            return;
        }
        
        try {
            const body = { type, question_id: questionId };
            if (answerId) body.answer_id = answerId;
            
            const response = await fetch(API_BASE + 'like.php?token=' + encodeURIComponent(token), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await response.json();
            if (data.success) {
                await renderQuestions();
                const question = allQuestions.find(q => q.id === questionId);
                if (question) {
                    renderAnswers(question);
                    const isLiked = question.liked_by?.includes(currentUser?.id);
                    document.getElementById('modalLikeIcon').className = `fas fa-heart${isLiked ? ' liked' : ''}`;
                    document.getElementById('modalLikeCount').textContent = question.upvotes || 0;
                }
            } else {
                showToast(data.error || 'Failed to like', true);
            }
        } catch(err) {
            showToast('Network error', true);
        }
    }

    // ==================== POST ANSWER ====================
    // In qna.html, update the submitAnswerBtn onclick handler
document.getElementById('submitAnswerBtn').onclick = async function() {
    const answer = document.getElementById('answerText').value.trim();
    if (!answer || !currentQuestionId) {
        showToast('Please write an answer', true);
        return;
    }
    
    const token = localStorage.getItem('busahmed_token');
    if (!token) {
        showToast('Please login to answer', true);
        return;
    }
    
    const btn = this;
    btn.disabled = true;
    btn.textContent = 'Posting...';
    
    try {
        const response = await fetch(API_BASE + 'answer-question.php?token=' + encodeURIComponent(token), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question_id: currentQuestionId, answer, image: null })
        });
        const data = await response.json();
        if (data.success) {
            showToast('Answer posted! You earned 3 points!');
            document.getElementById('answerText').value = '';
            await renderQuestions();
            const question = allQuestions.find(q => q.id === currentQuestionId);
            if (question) {
                renderAnswers(question);
                document.getElementById('modalAnswerCount').textContent = question.answers?.length || 0;
            }
        } else {
            showToast(data.error || 'Failed to post answer', true);
        }
    } catch(err) {
        showToast('Network error', true);
    } finally {
        btn.disabled = false;
        btn.textContent = 'Post Answer';
    }
};

    // ==================== ASK QUESTION ====================
    function openAskModal() {
        const modal = document.createElement("div");
        modal.className = "modal active";
        modal.innerHTML = `
            <div class="modal-content ask-modal">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                    <div class="modal-title">
                        <i class="fas fa-pen" style="color:#4f46e5;"></i> Ask a Question
                    </div>
                    <button onclick="this.closest('.modal').remove()" style="background:none; border:none; font-size:28px; cursor:pointer; color:#94a3b8; padding:0 8px;">&times;</button>
                </div>
                <input type="text" id="qTitle" placeholder="Question Title *">
                <textarea id="qContent" placeholder="Write your question in detail... *"></textarea>
                <div class="file-upload-wrapper">
                    <input type="file" id="qImage" accept="image/*">
                </div>
                <button class="btn-submit" id="submitQBtn">Post Question</button>
                <button class="btn-cancel" onclick="this.closest('.modal').remove()">Cancel</button>
            </div>
        `;
        document.body.appendChild(modal);
        modal.addEventListener('click', function(e) {
            if (e.target === this) this.remove();
        });
        
        document.getElementById("submitQBtn").onclick = async function() {
            const title = document.getElementById("qTitle").value.trim();
            const content = document.getElementById("qContent").value.trim();
            if (!title || !content) {
                showToast("Please fill in title and content", true);
                return;
            }
            
            const file = document.getElementById("qImage").files[0];
            let imageData = null;
            
            const submit = async (imgData) => {
                const token = localStorage.getItem('busahmed_token');
                try {
                    const response = await fetch(API_BASE + 'ask-question.php?token=' + encodeURIComponent(token), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title, content, image: imgData, subject: 'General', class: 'All' })
                    });
                    const data = await response.json();
                    if (data.success) {
                        modal.remove();
                        showToast("✅ Question submitted for approval!");
                        renderQuestions();
                    } else {
                        showToast(data.error || "Failed to submit", true);
                    }
                } catch(err) {
                    showToast('Network error', true);
                }
            };
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    submit(e.target.result);
                };
                reader.readAsDataURL(file);
            } else {
                submit(null);
            }
        };
    }

    // ==================== AUTO RESIZE TEXTAREA ====================
    document.addEventListener('DOMContentLoaded', function() {
        const answerText = document.getElementById('answerText');
        if (answerText) {
            answerText.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 100) + 'px';
            });
        }
    });

    // ==================== INIT ====================
    async function init() {
        currentUser = await checkAuth();
        await renderQuestions();
        renderAd('adContainer', 'qna', 10000);
        document.getElementById("askBtn").onclick = openAskModal;
        document.getElementById("backBtn").onclick = goBack;
        
        if (localStorage.getItem("busahmed_dark_mode") === "true") document.body.classList.add("dark-mode");
        
        window.openQuestionModal = openQuestionModal;
        window.closeQuestionModal = closeQuestionModal;
        window.viewUserProfile = viewUserProfile;
        window.toggleLike = toggleLike;
    }
    init();
</script>
