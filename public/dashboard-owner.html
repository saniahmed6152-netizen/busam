    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #1e1b4b, #4f46e5); min-height: 100vh; padding: 24px 16px; }
        .container { max-width: 700px; margin: 0 auto; }
        .dashboard-card { background: white; border-radius: 32px; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: linear-gradient(135deg, #1e1b4b, #4f46e5); color: white; padding: 24px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
        .badge { background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 40px; font-size: 0.75rem; font-weight: 600; }
        .profile-row { display: flex; align-items: center; gap: 16px; margin-top: 8px; }
        .avatar { width: 56px; height: 56px; background: #cbd5e1; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; color: #475569; font-size: 28px; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-info h2 { font-size: 1.25rem; font-weight: 700; }
        .user-info p { font-size: 0.8rem; opacity: 0.8; margin-top: 4px; }
        .user-stats { display: flex; gap: 20px; margin-top: 8px; flex-wrap: wrap; }
        .user-stats .stat-item { display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.15); padding: 4px 12px; border-radius: 40px; font-size: 0.75rem; }
        .user-stats .stat-item i { font-size: 12px; }
        .user-stats .stat-number { font-weight: 700; }
        .ad-space { margin: 16px 20px 0 20px; border-radius: 20px; overflow: hidden; height: 80px; display: flex; align-items: center; justify-content: center; position: relative; background: #f1f5f9; }
        .menu-list { padding: 20px; }
        .menu-item { background: #f8fafc; border-radius: 20px; padding: 14px 18px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: all 0.2s; border: 1px solid #e2e8f0; }
        .menu-item:hover { background: #eef2ff; transform: scale(1.01); }
        .menu-left { display: flex; align-items: center; gap: 14px; }
        .menu-icon { width: 48px; height: 48px; background: #e0e7ff; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #4f46e5; font-size: 1.4rem; }
        .menu-title { font-weight: 700; color: #0f172a; }
        .chevron { color: #94a3b8; }
        .unread-badge { background: #ef4444; color: white; border-radius: 50%; padding: 2px 8px; font-size: 11px; font-weight: 600; margin-left: 4px; }
        .appointed-badge { background: #8b5cf6; color: white; border-radius: 40px; padding: 2px 12px; font-size: 10px; font-weight: 600; margin-left: 8px; }
        .pending-badge { background: #f59e0b; color: white; border-radius: 40px; padding: 2px 12px; font-size: 10px; font-weight: 600; margin-left: 8px; }
        .dark-mode { background: #0f172a; }
        .dark-mode .dashboard-card { background: #1e293b; }
        .dark-mode .menu-item { background: #1e293b; border-color: #334155; }
        .dark-mode .menu-title { color: #f1f5f9; }
        .dark-mode .menu-icon { background: #334155; color: #a5b4fc; }
        .dark-mode .ad-space { background: #0f172a; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 8px 20px; border-radius: 40px; font-size: 0.8rem; z-index: 2000; }
        .check-btn { background: #8b5cf6; color: white; border: none; border-radius: 40px; padding: 4px 12px; cursor: pointer; font-size: 11px; transition: 0.2s; }
        .check-btn:hover { background: #7c3aed; }
        @media (max-width: 500px) {
            .menu-item { padding: 12px 14px; }
            .menu-icon { width: 40px; height: 40px; font-size: 1.2rem; }
            .user-stats { gap: 8px; }
            .user-stats .stat-item { font-size: 0.7rem; padding: 2px 8px; }
        }

<body>
<div class="container">
    <div class="dashboard-card">
        <div class="header">
            <div class="header-top">
                <div><i class="fas fa-building" style="font-size:1.8rem;"></i> <span style="font-weight:800; font-size:1.4rem;">School Owner Dashboard</span></div>
                <div style="display:flex; gap:8px; align-items:center;">
                    <button class="check-btn" onclick="manualCheckAppointment()"><i class="fas fa-sync"></i> Check</button>
                    <div class="badge">Owner</div>
                </div>
            </div>
            <div class="profile-row" id="profileInfo">Loading...</div>
        </div>
        <div id="adContainer" class="ad-space">📢 Loading ad...</div>
        <div class="menu-list" id="menuList"></div>
    </div>
</div>

<script>
const API_BASE = window.location.origin + '/api/';
    let adInterval = null;
    let currentUser = null;
    let userPermissions = {};
    let isAppointedAdmin = false;
    let appointmentStatus = null;
    let appointmentOverlay = null;

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    function getToken() {
        return localStorage.getItem('busahmed_token');
    }

    function showToast(msg, isError = false) {
        const t = document.createElement("div");
        t.className = "toast";
        t.innerText = msg;
        if (isError) t.style.background = "#dc2626";
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    // ==================== AD HELPER - FIXED ====================
    function renderAd(containerId, location, intervalTime = 10000) {
        const container = document.getElementById(containerId);
        if (!container) return;
        
        if (adInterval) {
            clearInterval(adInterval);
            adInterval = null;
        }
        
        container.innerHTML = "📢 Loading ad...";
        container.style.cssText = `
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            cursor: default;
            color: #94a3b8;
            font-size: 14px;
        `;
        
        fetch(`${API_BASE}ads.php?location=${location}`)
            .then(response => response.json())
            .then(ads => {
                if (!ads || ads.length === 0) {
                    container.innerHTML = "📢 Ad space - Promote your school";
                    container.style.cssText = `
                        background: #f1f5f9;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        height: 80px;
                        border-radius: 20px;
                        overflow: hidden;
                        position: relative;
                        cursor: default;
                        color: #94a3b8;
                        font-size: 14px;
                    `;
                    return;
                }
                
                let idx = 0;
                
                function showAd() {
                    const ad = ads[idx % ads.length];
                    
                    // *** FIXED: Handle image URL properly ***
                    let imageUrl = ad.image_url || 'https://via.placeholder.com/800x100/4f46e5/ffffff?text=Ad';
                    
                    if (!imageUrl || imageUrl === 'data:image/jpeg;base64,' || imageUrl === '') {
                        imageUrl = 'https://via.placeholder.com/800x100/4f46e5/ffffff?text=Ad';
                    } else if (imageUrl.startsWith('/busahmed/') || imageUrl.startsWith('/uploads/')) {
                        imageUrl = window.location.origin + imageUrl;
                    } else if (imageUrl.startsWith('uploads/')) {
                        imageUrl = window.location.origin + '/busahmed/' + imageUrl;
                    } else if (!imageUrl.startsWith('http://') && !imageUrl.startsWith('https://')) {
                        const cleanUrl = imageUrl.replace(/^\//, '');
                        imageUrl = window.location.origin + '/busahmed/' + cleanUrl;
                    }
                    
                    console.log('📢 Displaying ad image:', imageUrl);
                    
                    const linkUrl = ad.link || '#';
                    
                    container.innerHTML = `
                        <img src="${imageUrl}" 
                             style="width:100%; height:80px; object-fit:cover; display:block;" 
                             onerror="console.error('Image failed to load:', '${imageUrl}'); this.style.display='none';this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:80px;background:#1e293b;color:#94a3b8;font-size:14px;\\'>📢 Ad</div>'">
                        <div style="position:absolute; bottom:4px; right:8px; background:rgba(0,0,0,0.6); color:white; font-size:10px; padding:2px 10px; border-radius:20px;">
                            ${ad.caption || "Sponsored"} | 👁️ ${ad.views || 0}
                        </div>
                    `;
                    container.style.cssText = `
                        background: transparent;
                        display: block;
                        height: 80px;
                        border-radius: 20px;
                        overflow: hidden;
                        position: relative;
                        cursor: pointer;
                        padding: 0;
                    `;
                    container.onclick = function(e) {
                        e.preventDefault();
                        if (linkUrl && linkUrl !== '#') {
                            window.open(linkUrl, "_blank");
                        }
                    };
                    idx++;
                }
                
                showAd();
                
                if (ads.length > 1) {
                    adInterval = setInterval(showAd, intervalTime);
                }
            })
            .catch(err => {
                console.error("Ad error:", err);
                container.innerHTML = "📢 Ad unavailable";
                container.style.cssText = `
                    background: #f1f5f9;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    height: 80px;
                    border-radius: 20px;
                    overflow: hidden;
                    position: relative;
                    cursor: default;
                    color: #94a3b8;
                    font-size: 14px;
                `;
            });
    }
    // =============================================

    // ==================== CHECK SUSPENSION ====================
    async function checkSuspension() {
        const token = getToken();
        if (!token) return;
        try {
            const response = await fetch(API_BASE + 'profile.php?token=' + encodeURIComponent(token));
            if (!response.ok) {
                localStorage.clear();
                window.location.href = 'login.html';
                return;
            }
            const user = await response.json();
            if (user.suspended == 1) {
                localStorage.clear();
                showToast('Your account has been suspended. Please contact support.', true);
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                return;
            }
        } catch(err) {
            console.error('Suspension check error:', err);
        }
    }

    // ==================== ADMIN APPOINTMENT ====================
    async function checkAdminAppointment(silent = true) {
        const token = getToken();
        if (!token) return;
        
        try {
            const response = await fetch(API_BASE + 'check-admin-status.php?token=' + encodeURIComponent(token));
            const data = await response.json();
            
            if (data.success) {
                userPermissions = data.permissions || {};
                isAppointedAdmin = data.is_appointed_admin || false;
                appointmentStatus = data.appointment_status || null;
                
                console.log('📊 Admin Appointment Status:');
                console.log('  - is_appointed_admin:', isAppointedAdmin);
                console.log('  - appointment_status:', appointmentStatus);
                console.log('  - permissions:', userPermissions);
                console.log('  - has_pending_appointment:', data.has_pending_appointment);
                
                if (data.has_pending_appointment && appointmentStatus === 'pending') {
                    console.log('✅ Showing appointment dialog');
                    showAppointmentDialog(data.user);
                } else if (!silent) {
                    if (isAppointedAdmin && appointmentStatus === 'accepted') {
                        showToast('✅ You are an appointed admin!');
                    } else {
                        showToast('No pending admin appointment.');
                    }
                }
            }
        } catch(err) {
            console.error('Check admin appointment error:', err);
            if (!silent) {
                showToast('Error checking appointment', true);
            }
        }
    }

    // ==================== MANUAL CHECK ====================
    async function manualCheckAppointment() {
        const token = getToken();
        if (!token) {
            showToast('Please login first', true);
            return;
        }
        await checkAdminAppointment(false);
    }

    window.manualCheckAppointment = manualCheckAppointment;

    function showAppointmentDialog(user) {
        if (appointmentOverlay) {
            appointmentOverlay.remove();
            appointmentOverlay = null;
        }
        
        const overlay = document.createElement('div');
        overlay.style.cssText = `
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; padding: 20px;
        `;
        
        overlay.innerHTML = `
            <div style="background: white; border-radius: 32px; max-width: 450px; width: 100%; padding: 32px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
                <div style="font-size: 48px; margin-bottom: 16px;">👑</div>
                <h2 style="color: #1e1b4b; margin-bottom: 12px;">Admin Appointment</h2>
                <p style="color: #64748b; margin-bottom: 8px;">You have been appointed as an admin by</p>
                <p style="font-weight: 600; color: #4f46e5; margin-bottom: 16px;">${escapeHtml(user.appointed_by_name || 'Administrator')}</p>
                <p style="color: #94a3b8; font-size: 14px; margin-bottom: 24px;">Accept this appointment to gain access to admin features. After acceptance, the main admin will assign your permissions.</p>
                <div style="display: flex; gap: 12px;">
                    <button onclick="handleAppointment('accept')" style="flex: 1; background: #10b981; color: white; border: none; border-radius: 40px; padding: 12px; cursor: pointer; font-weight: 600; font-size: 14px;">
                        <i class="fas fa-check"></i> Accept
                    </button>
                    <button onclick="handleAppointment('reject')" style="flex: 1; background: #ef4444; color: white; border: none; border-radius: 40px; padding: 12px; cursor: pointer; font-weight: 600; font-size: 14px;">
                        <i class="fas fa-times"></i> Reject
                    </button>
                </div>
            </div>
        `;
        
        if (localStorage.getItem("busahmed_dark_mode") === "true") {
            const dialog = overlay.querySelector('div');
            dialog.style.background = '#1e293b';
            dialog.querySelector('h2').style.color = '#f1f5f9';
            dialog.querySelectorAll('p').forEach(p => p.style.color = '#94a3b8');
        }
        
        document.body.appendChild(overlay);
        appointmentOverlay = overlay;
    }

    window.handleAppointment = async function(action) {
        const token = getToken();
        if (!token) {
            window.location.href = 'login.html';
            return;
        }
        
        let userId = currentUser?.id || null;
        if (!userId) {
            try {
                const response = await fetch(API_BASE + 'profile.php?token=' + encodeURIComponent(token));
                const data = await response.json();
                userId = data.id;
            } catch(err) {}
        }
        
        try {
            const response = await fetch(API_BASE + 'admin-appointments.php?token=' + encodeURIComponent(token), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: action, user_id: userId })
            });
            const data = await response.json();
            
            if (appointmentOverlay) {
                appointmentOverlay.remove();
                appointmentOverlay = null;
            }
            
            if (data.success) {
                showToast(data.message);
                if (action === 'accept') {
                    setTimeout(() => location.reload(), 1500);
                } else {
                    setTimeout(() => location.reload(), 1000);
                }
            } else {
                showToast(data.error || 'Failed to process', true);
            }
        } catch(err) {
            showToast('Network error', true);
        }
    };

    // ==================== BUILD MENU ====================
    function buildMenuItems(user) {
        const baseItems = [
            { title: "Chat", icon: "fa-comments", link: "chat.html", hasBadge: true },
            { title: "Videos", icon: "fa-video", link: "videos.html" },
            { title: "News & Updates", icon: "fa-newspaper", link: "news.html" },
            { title: "Q&A Board", icon: "fa-question-circle", link: "qna.html" },
            { title: "Library", icon: "fa-book", link: "library.html" },
            { title: "My Network", icon: "fa-users", link: "followers.html" },
            { title: "Job Vacancies", icon: "fa-briefcase", link: "jobs.html?v=2" },
            { title: "Advertise", icon: "fa-ad", link: "advertise.html" },
            { title: "Career (IT Courses)", icon: "fa-laptop-code", link: "career.html" }
        ];
        
        const isFullAdmin = user.role === 'admin';
        const isAppointedAndAccepted = user.is_appointed_admin == 1 && user.admin_appointment_status === 'accepted';
        const canManageNews = user.can_manage_news == 1;
        const canManageJobs = user.can_manage_jobs == 1;
        const canManageCareers = user.can_manage_careers == 1;
        const canManageLibrary = user.can_manage_library == 1;
        
        if (isFullAdmin || (isAppointedAndAccepted && canManageNews)) {
            baseItems.push({ title: "📰 News Manager", icon: "fa-newspaper", link: "news-manager.html" });
        }
        if (isFullAdmin || (isAppointedAndAccepted && canManageJobs)) {
            baseItems.push({ title: "💼 Job Manager", icon: "fa-briefcase", link: "job-manager.html" });
        }
        if (isFullAdmin || (isAppointedAndAccepted && canManageCareers)) {
            baseItems.push({ title: "🎓 Career Manager", icon: "fa-laptop-code", link: "career-manager.html" });
        }
        if (isFullAdmin || (isAppointedAndAccepted && canManageLibrary)) {
            baseItems.push({ title: "📚 Library Manager", icon: "fa-book", link: "library-manager.html" });
        }
        
        baseItems.push(
            { title: "My Profile", icon: "fa-user-circle", link: "profile.html" },
            { title: "Settings", icon: "fa-cog", link: "settings.html" }
        );
        
        return baseItems;
    }

    // ==================== LOAD DASHBOARD ====================
    async function loadDashboard() {
        const token = getToken();
        if (!token) {
            window.location.href = 'login.html';
            return;
        }
        
        try {
            const response = await fetch(API_BASE + 'profile.php?token=' + encodeURIComponent(token));
            
            if (!response.ok) {
                localStorage.clear();
                window.location.href = 'login.html';
                return;
            }
            
            const user = await response.json();
            currentUser = user;
            
            if (user.suspended == 1) {
                localStorage.clear();
                showToast('Your account has been suspended. Please contact support.', true);
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                return;
            }
            
            const avatarHtml = user.avatar ? `<img src="${user.avatar}">` : `<i class="fas fa-user"></i>`;
            
            let statusBadge = '';
            if (user.is_appointed_admin == 1) {
                if (user.admin_appointment_status === 'pending') {
                    statusBadge = `<span class="pending-badge">⏳ Pending Approval</span>`;
                } else if (user.admin_appointment_status === 'accepted') {
                    statusBadge = `<span class="appointed-badge">👑 Appointed Admin</span>`;
                }
            }
            
            const followersCount = user.followers_count || 0;
            const followingCount = user.following_count || 0;
            const points = user.points || 0;

            document.getElementById("profileInfo").innerHTML = `
                <div class="avatar">${avatarHtml}</div>
                <div class="user-info">
                    <h2>${escapeHtml(user.name)} ${statusBadge}</h2>
                    <p>${user.role === 'student' ? 'Class: ' + escapeHtml(user.class || "Not set") : 
                       user.role === 'teacher' ? 'Subject: ' + escapeHtml(user.subject || "Not set") :
                       user.role === 'owner' ? '🏫 School: ' + escapeHtml(user.school || "Not set") :
                       'Role: ' + escapeHtml(user.role)}</p>
                    <div class="user-stats">
                        <span class="stat-item"><i class="fas fa-users"></i> <span class="stat-number">${followersCount}</span> Followers</span>
                        <span class="stat-item"><i class="fas fa-user-friends"></i> <span class="stat-number">${followingCount}</span> Following</span>
                        <span class="stat-item"><i class="fas fa-star"></i> <span class="stat-number">${points}</span> Points</span>
                    </div>
                </div>
            `;
            
            await checkAdminAppointment(true);
            
            const menuItems = buildMenuItems(user);
            
            let menuHtml = "";
            menuItems.forEach(item => {
                const badgeHtml = item.hasBadge ? `<span class="unread-badge" id="unreadBadge" style="display:none;">0</span>` : '';
                menuHtml += `<div class="menu-item" data-link="${item.link}">
                                <div class="menu-left">
                                    <div class="menu-icon"><i class="fas ${item.icon}"></i></div>
                                    <div class="menu-title">${escapeHtml(item.title)}${badgeHtml}</div>
                                </div>
                                <div class="chevron"><i class="fas fa-chevron-right"></i></div>
                            </div>`;
            });
            document.getElementById("menuList").innerHTML = menuHtml;
            
            document.querySelectorAll(".menu-item").forEach(el => {
                el.onclick = () => {
                    window.location.href = el.dataset.link;
                };
            });
            
            await updateUnreadCount();
            setInterval(updateUnreadCount, 15000);
            
            // Render ad with fixed function
            renderAd('adContainer', 'dashboard', 10000);
            
            setInterval(checkSuspension, 30000);
            
        } catch(err) {
            console.error("Dashboard error:", err);
            document.getElementById("profileInfo").innerHTML = `
                <div style="color:white; padding:20px; text-align:center;">
                    <i class="fas fa-exclamation-triangle" style="font-size:32px; display:block; margin-bottom:12px;"></i>
                    Error loading dashboard: ${escapeHtml(err.message)}
                    <br><br>
                    <button onclick="location.reload()" style="background:rgba(255,255,255,0.2); color:white; border:none; border-radius:40px; padding:8px 20px; cursor:pointer;">Retry</button>
                </div>
            `;
        }
    }
    
    async function updateUnreadCount() {
        const token = getToken();
        if (!token) return;
        try {
            const response = await fetch(API_BASE + 'chat-unread-count.php?token=' + encodeURIComponent(token));
            const data = await response.json();
            const badge = document.getElementById('unreadBadge');
            if (badge && data.unread_count > 0) {
                badge.textContent = data.unread_count;
                badge.style.display = 'inline';
            } else if (badge) {
                badge.style.display = 'none';
            }
        } catch(err) {
            console.error("Error fetching unread count:", err);
        }
    }
    
    loadDashboard();
    if (localStorage.getItem("busahmed_dark_mode") === "true") document.body.classList.add("dark-mode");
</script>
</body>
</html>
