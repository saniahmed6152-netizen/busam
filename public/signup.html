<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BUSAHMED | Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BUSAHMED">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileColor" content="#4f46e5">
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png">
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-57x57.png" sizes="57x57">
    <link rel="apple-touch-icon" href="/icons/icon-72x72.png" sizes="72x72">
    <link rel="apple-touch-icon" href="/icons/icon-76x76.png" sizes="76x76">
    <link rel="apple-touch-icon" href="/icons/icon-114x114.png" sizes="114x114">
    <link rel="apple-touch-icon" href="/icons/icon-120x120.png" sizes="120x120">
    <link rel="apple-touch-icon" href="/icons/icon-144x144.png" sizes="144x144">
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png" sizes="152x152">
    <link rel="apple-touch-icon" href="/icons/icon-167x167.png" sizes="167x167">
    <link rel="apple-touch-icon" href="/icons/icon-180x180.png" sizes="180x180">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
    <link rel="shortcut icon" href="/icons/favicon.ico">
    
    <!-- Microsoft Tiles -->
    <meta name="msapplication-square70x70logo" content="/icons/icon-72x72.png">
    <meta name="msapplication-square150x150logo" content="/icons/icon-144x144.png">
    <meta name="msapplication-wide310x150logo" content="/icons/icon-384x384.png">
    <meta name="msapplication-square310x310logo" content="/icons/icon-512x512.png">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #1e1b4b, #4f46e5); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .signup-card { background: white; border-radius: 32px; padding: 32px; max-width: 450px; width: 100%; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.2); }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo i { font-size: 48px; color: #4f46e5; }
        .logo h1 { font-size: 28px; margin-top: 8px; color: #1e1b4b; }
        .input-group { margin-bottom: 16px; }
        input, select { width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 40px; font-size: 16px; outline: none; }
        input:focus, select:focus { border-color: #4f46e5; }
        button { width: 100%; padding: 14px; background: #4f46e5; color: white; border: none; border-radius: 40px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .footer { text-align: center; margin-top: 24px; font-size: 14px; color: #64748b; }
        .footer a { color: #4f46e5; text-decoration: none; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 8px 20px; border-radius: 40px; font-size: 14px; z-index: 2000; }
        .dark-mode { background: #0f172a; }
        .dark-mode .signup-card { background: #1e293b; color: #e2e8f0; }
        .dark-mode .logo h1 { color: #f1f5f9; }
        .dark-mode input, .dark-mode select { background: #334155; border-color: #475569; color: white; }
    </style>
</head>
<body>
<div class="signup-card">
    <div class="logo">
        <i class="fas fa-brain"></i>
        <h1>Create Account</h1>
        <p style="color:#64748b; font-size:14px;">Join the BUSAHMED community</p>
    </div>
    <div class="input-group"><input type="text" id="signupName" placeholder="Full Name"></div>
    <div class="input-group"><input type="email" id="signupEmail" placeholder="Email Address"></div>
    <div class="input-group"><input type="tel" id="signupPhone" placeholder="Phone Number"></div>
    <div class="input-group">
        <select id="signupRole">
            <option value="">Select your role</option>
            <option value="student">🎓 Student</option>
            <option value="teacher">👨‍🏫 Teacher</option>
            <option value="owner">🏫 School Owner</option>
        </select>
    </div>
    <div id="studentField" style="display:none;"><input type="text" id="signupClass" placeholder="Class (e.g., SS1)"></div>
    <div id="teacherField" style="display:none;"><input type="text" id="signupSubject" placeholder="Subject Area"></div>
    <div id="ownerField" style="display:none;"><input type="text" id="signupSchool" placeholder="School Name"></div>
    <div class="input-group"><input type="password" id="signupPassword" placeholder="Password (min 4 characters)"></div>
    <div class="input-group"><input type="password" id="signupConfirm" placeholder="Confirm Password"></div>
    <button id="signupBtn">Register</button>
    <div class="footer">Already have an account? <a href="login.html">Sign In</a></div>
</div>

<script>
const API_BASE = window.location.origin + '/api/';
    function showToast(msg, isError = false) {
        const t = document.createElement("div");
        t.className = "toast";
        t.innerText = msg;
        if (isError) t.style.background = "#dc2626";
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    document.getElementById("signupRole").addEventListener("change", (e) => {
        const role = e.target.value;
        document.getElementById("studentField").style.display = role === "student" ? "block" : "none";
        document.getElementById("teacherField").style.display = role === "teacher" ? "block" : "none";
        document.getElementById("ownerField").style.display = role === "owner" ? "block" : "none";
    });

    document.getElementById("signupBtn").onclick = async () => {
        const name = document.getElementById("signupName").value.trim();
        const email = document.getElementById("signupEmail").value.trim();
        const phone = document.getElementById("signupPhone").value.trim();
        const role = document.getElementById("signupRole").value;
        const password = document.getElementById("signupPassword").value;
        const confirm = document.getElementById("signupConfirm").value;

        if (!name || !email || !phone || !role || !password) {
            showToast("Please fill all required fields", true);
            return;
        }
        if (password !== confirm) {
            showToast("Passwords do not match", true);
            return;
        }
        if (password.length < 4) {
            showToast("Password must be at least 4 characters", true);
            return;
        }

        const payload = {
            name, email, phone, password, role,
            class: document.getElementById("signupClass").value || null,
            subject: document.getElementById("signupSubject").value || null,
            school: document.getElementById("signupSchool").value || null
        };

        try {
            const response = await fetch(API_BASE + 'signup.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (data.success) {
                showToast("Account created! Redirecting to login...");
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2000);
            } else {
                showToast(data.error || "Signup failed", true);
            }
        } catch (err) {
            showToast("Network error: " + err.message, true);
            console.error(err);
        }
    };
    
    if (localStorage.getItem("busahmed_dark_mode") === "true") document.body.classList.add("dark-mode");
</script>
</body>
</html>
