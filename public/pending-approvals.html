<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BUSAHMED | Pending Approvals</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BUSAHMED">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileColor" content="#4f46e5">
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png">
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-57x57.png" sizes="57x57">
    <link rel="apple-touch-icon" href="/icons/icon-72x72.png" sizes="72x72">
    <link rel="apple-touch-icon" href="/icons/icon-76x76.png" sizes="76x76">
    <link rel="apple-touch-icon" href="/icons/icon-114x114.png" sizes="114x114">
    <link rel="apple-touch-icon" href="/icons/icon-120x120.png" sizes="120x120">
    <link rel="apple-touch-icon" href="/icons/icon-144x144.png" sizes="144x144">
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png" sizes="152x152">
    <link rel="apple-touch-icon" href="/icons/icon-167x167.png" sizes="167x167">
    <link rel="apple-touch-icon" href="/icons/icon-180x180.png" sizes="180x180">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
    <link rel="shortcut icon" href="/icons/favicon.ico">
    
    <!-- Microsoft Tiles -->
    <meta name="msapplication-square70x70logo" content="/icons/icon-72x72.png">
    <meta name="msapplication-square150x150logo" content="/icons/icon-144x144.png">
    <meta name="msapplication-wide310x150logo" content="/icons/icon-384x384.png">
    <meta name="msapplication-square310x310logo" content="/icons/icon-512x512.png">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #1e1b4b, #4f46e5); min-height: 100vh; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .card { background: white; border-radius: 32px; padding: 24px; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.2); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        h1 { font-size: 24px; color: #1e1b4b; display: flex; align-items: center; gap: 10px; }
        .back-btn { background: #e2e8f0; border: none; border-radius: 40px; padding: 8px 20px; cursor: pointer; font-weight: 600; }
        .pending-card { background: #f8fafc; border-radius: 20px; padding: 16px; margin-bottom: 16px; border-left: 4px solid #f59e0b; }
        .btn-approve { background: #10b981; color: white; border: none; border-radius: 40px; padding: 6px 16px; margin-right: 8px; cursor: pointer; }
        .btn-approve:hover { background: #059669; }
        .btn-reject { background: #ef4444; color: white; border: none; border-radius: 40px; padding: 6px 16px; cursor: pointer; }
        .btn-reject:hover { background: #dc2626; }
        .dark-mode { background: #0f172a; }
        .dark-mode .card { background: #1e293b; }
        .dark-mode h1 { color: #f1f5f9; }
        .dark-mode .pending-card { background: #1e293b; border-color: #f59e0b; color: #e2e8f0; }
        .dark-mode .back-btn { background: #334155; color: #e2e8f0; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 8px 20px; border-radius: 40px; font-size: 14px; z-index: 2000; }
        .loading-spinner { text-align: center; padding: 40px; color: #94a3b8; }
        .loading-spinner i { font-size: 30px; display: block; margin-bottom: 12px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <h1><i class="fas fa-clock" style="color:#4f46e5;"></i> Pending Approvals</h1>
            <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> Back</button>
        </div>
        <div id="pendingList">
            <div class="loading-spinner"><i class="fas fa-spinner"></i> Loading pending questions...</div>
        </div>
    </div>
</div>

<script>
const API_BASE = window.location.origin + '/api/';
    
    // Universal session check
    async function checkAuth() {
        const token = localStorage.getItem('busahmed_token');
        if (!token) {
            window.location.href = 'login.html';
            return null;
        }
        try {
            const response = await fetch(API_BASE + 'profile.php?token=' + encodeURIComponent(token));
            if (!response.ok) {
                localStorage.clear();
                window.location.href = 'login.html';
                return null;
            }
            const user = await response.json();
            if (user.role !== 'admin') {
                window.location.href = 'login.html';
                return null;
            }
            return user;
        } catch(err) {
            console.error("Auth error:", err);
            window.location.href = 'login.html';
            return null;
        }
    }
    
    function goBack() {
        window.location.href = 'dashboard-admin.html';
    }
    
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    function showToast(msg, isError = false) {
        const t = document.createElement("div");
        t.className = "toast";
        t.innerText = msg;
        if (isError) t.style.background = "#dc2626";
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }
    
    async function loadPending() {
        const user = await checkAuth();
        if (!user) return;
        
        const token = localStorage.getItem('busahmed_token');
        const container = document.getElementById('pendingList');
        container.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner"></i> Loading pending questions...</div>';
        
        try {
            const response = await fetch(API_BASE + 'pending-questions.php?token=' + encodeURIComponent(token));
            const pending = await response.json();
            
            if (pending.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:40px;">No pending questions</p>';
                return;
            }
            
            let html = '';
            pending.forEach(q => {
                html += `<div class="pending-card" id="pending-${q.id}">
                            <div><strong>${escapeHtml(q.title)}</strong></div>
                            <div style="margin:8px 0;">${escapeHtml(q.content.substring(0, 150))}${q.content.length > 150 ? '...' : ''}</div>
                            <div style="font-size:12px; color:#64748b;">By: ${escapeHtml(q.asked_by_name)} | ${escapeHtml(q.class || 'N/A')} | ${escapeHtml(q.subject || 'N/A')}</div>
                            <div style="margin-top:12px;">
                                <button class="btn-approve" data-id="${q.id}">✓ Approve</button>
                                <button class="btn-reject" data-id="${q.id}">✗ Reject</button>
                            </div>
                        </div>`;
            });
            container.innerHTML = html;
            
            // Approve button handler
            document.querySelectorAll('.btn-approve').forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.dataset.id;
                    const token = localStorage.getItem('busahmed_token');
                    try {
                        const response = await fetch(API_BASE + 'approve-question.php?token=' + encodeURIComponent(token), {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ id, action: 'approve' })
                        });
                        const data = await response.json();
                        if (data.success) {
                            showToast('✅ Question approved!');
                            // Remove the item from the list
                            const card = document.getElementById(`pending-${id}`);
                            if (card) card.remove();
                            // Reload the list if empty
                            const remaining = document.querySelectorAll('.pending-card');
                            if (remaining.length === 0) {
                                document.getElementById('pendingList').innerHTML = '<p style="text-align:center; padding:40px;">No pending questions</p>';
                            }
                        } else {
                            showToast(data.error || 'Failed to approve', true);
                        }
                    } catch(err) {
                        showToast('Error: ' + err.message, true);
                    }
                };
            });
            
            // Reject button handler
            document.querySelectorAll('.btn-reject').forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.dataset.id;
                    const token = localStorage.getItem('busahmed_token');
                    try {
                        const response = await fetch(API_BASE + 'approve-question.php?token=' + encodeURIComponent(token), {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ id, action: 'reject' })
                        });
                        const data = await response.json();
                        if (data.success) {
                            showToast('Question rejected');
                            const card = document.getElementById(`pending-${id}`);
                            if (card) card.remove();
                            const remaining = document.querySelectorAll('.pending-card');
                            if (remaining.length === 0) {
                                document.getElementById('pendingList').innerHTML = '<p style="text-align:center; padding:40px;">No pending questions</p>';
                            }
                        } else {
                            showToast(data.error || 'Failed to reject', true);
                        }
                    } catch(err) {
                        showToast('Error: ' + err.message, true);
                    }
                };
            });
        } catch(err) {
            console.error(err);
            container.innerHTML = '<p style="text-align:center; padding:40px;">Error loading pending questions</p>';
        }
    }
    
    loadPending();
    if (localStorage.getItem("busahmed_dark_mode") === "true") document.body.classList.add("dark-mode");
</script>
</body>
</html>
