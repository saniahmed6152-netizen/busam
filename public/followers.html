    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #1e1b4b, #4f46e5); min-height: 100vh; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .card { background: white; border-radius: 32px; padding: 24px; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.2); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        h1 { font-size: 24px; color: #1e1b4b; display: flex; align-items: center; gap: 10px; }
        .back-btn { background: #e2e8f0; border: none; border-radius: 40px; padding: 8px 20px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .back-btn:hover { background: #cbd5e1; }
        .search-box { width: 100%; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 40px; margin-bottom: 16px; font-size: 14px; outline: none; transition: 0.2s; }
        .search-box:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
        .tabs { display: flex; gap: 24px; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; }
        .tab { padding: 8px 0; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .tab.active { color: #4f46e5; border-bottom: 2px solid #4f46e5; }
        .user-card { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border-radius: 20px; padding: 12px; margin-bottom: 12px; border: 1px solid #e2e8f0; transition: 0.2s; }
        .user-card:hover { transform: scale(1.01); background: #eef2ff; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .profile-pic { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #475569; overflow: hidden; }
        .profile-pic img { width: 100%; height: 100%; object-fit: cover; }
        .follow-btn { background: #4f46e5; color: white; border: none; border-radius: 40px; padding: 4px 16px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .follow-btn:hover { background: #4338ca; }
        .follow-btn.following { background: #10b981; }
        .dark-mode { background: #0f172a; }
        .dark-mode .card { background: #1e293b; }
        .dark-mode .user-card { background: #1e293b; border-color: #334155; color: #e2e8f0; }
        .dark-mode .user-card:hover { background: #334155; }
        .dark-mode .back-btn { background: #334155; color: #e2e8f0; }
        .dark-mode .back-btn:hover { background: #475569; }
        .dark-mode .tab.active { color: #a5b4fc; border-bottom-color: #a5b4fc; }
        .dark-mode .search-box { background: #334155; border-color: #475569; color: white; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 8px 20px; border-radius: 40px; font-size: 14px; z-index: 2000; }

<body>
<div class="container">
    <div class="card">
        <div class="header">
            <h1><i class="fas fa-users" style="color:#4f46e5;"></i> My Network</h1>
            <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> Back</button>
        </div>
        <input type="text" id="searchUsers" class="search-box" placeholder="🔍 Search users by name, email, phone, or school...">
        <div id="searchResults" style="margin-bottom: 16px;"></div>
        <div class="tabs">
            <div class="tab active" data-tab="followers">Followers</div>
            <div class="tab" data-tab="following">Following</div>
        </div>
        <div id="followersList"></div>
        <div id="followingList" style="display:none;"></div>
    </div>
</div>

<script>
const API_BASE = window.location.origin + '/api/';
    let currentUser = null;
    let searchTimeout = null;

    function showToast(msg, isError = false) {
        const t = document.createElement("div");
        t.className = "toast";
        t.innerText = msg;
        if (isError) t.style.background = "#dc2626";
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    // ========== SESSION CHECK ==========
    async function checkAuth() {
        const token = localStorage.getItem('busahmed_token');
        console.log('Token exists:', token ? 'YES' : 'NO');
        
        if (!token) {
            console.log('No token, redirecting to login');
            window.location.href = 'login.html';
            return null;
        }
        
        try {
            const response = await fetch(API_BASE + 'profile.php?token=' + encodeURIComponent(token), {
                mode: 'cors'
            });
            console.log('Profile status:', response.status);
            
            if (!response.ok) {
                console.log('Profile failed, clearing storage');
                localStorage.clear();
                window.location.href = 'login.html';
                return null;
            }
            
            const user = await response.json();
            console.log('User role:', user.role);
            return user;
        } catch(err) {
            console.error('Auth error:', err);
            window.location.href = 'login.html';
            return null;
        }
    }
    // =========================================

    async function goBack() {
        const user = await checkAuth();
        if (user) {
            if (user.role === 'student') window.location.href = 'dashboard-student.html';
            else if (user.role === 'teacher') window.location.href = 'dashboard-teacher.html';
            else if (user.role === 'admin') window.location.href = 'dashboard-admin.html';
            else if (user.role === 'owner') window.location.href = 'dashboard-owner.html';
            else window.location.href = 'login.html';
        }
    }

    async function loadFollowers() {
        const token = localStorage.getItem('busahmed_token');
        if (!token) return;
        try {
            const response = await fetch(API_BASE + 'followers.php?token=' + encodeURIComponent(token), {
                mode: 'cors'
            });
            const followers = await response.json();
            renderFollowers(followers);
        } catch(err) { 
            console.error(err);
            document.getElementById("followersList").innerHTML = '<p>Error loading followers</p>';
        }
    }

    function renderFollowers(followers) {
        if (!followers || followers.length === 0) {
            document.getElementById("followersList").innerHTML = '<p style="text-align:center; padding:40px;">No followers yet</p>';
            return;
        }
        let html = "";
        followers.forEach(f => {
            html += `<div class="user-card">
                        <div class="user-info">
                            <div class="profile-pic">${f.avatar ? `<img src="${f.avatar}">` : '<i class="fas fa-user"></i>'}</div>
                            <div><strong>${escapeHtml(f.name)}</strong><br>${escapeHtml(f.role)}</div>
                        </div>
                        <button class="follow-btn following" data-id="${f.id}" data-action="unfollow">Following ✓</button>
                    </div>`;
        });
        document.getElementById("followersList").innerHTML = html;
        attachFollowButtons();
    }

    async function loadFollowing() {
        const token = localStorage.getItem('busahmed_token');
        if (!token) return;
        try {
            const response = await fetch(API_BASE + 'following.php?token=' + encodeURIComponent(token), {
                mode: 'cors'
            });
            const following = await response.json();
            renderFollowing(following);
        } catch(err) { 
            console.error(err);
            document.getElementById("followingList").innerHTML = '<p>Error loading following</p>';
        }
    }

    function renderFollowing(following) {
        if (!following || following.length === 0) {
            document.getElementById("followingList").innerHTML = '<p style="text-align:center; padding:40px;">Not following anyone</p>';
            return;
        }
        let html = "";
        following.forEach(f => {
            html += `<div class="user-card">
                        <div class="user-info">
                            <div class="profile-pic">${f.avatar ? `<img src="${f.avatar}">` : '<i class="fas fa-user"></i>'}</div>
                            <div><strong>${escapeHtml(f.name)}</strong><br>${escapeHtml(f.role)}</div>
                        </div>
                        <button class="follow-btn" data-id="${f.id}" data-action="follow">Follow</button>
                    </div>`;
        });
        document.getElementById("followingList").innerHTML = html;
        attachFollowButtons();
    }

    function attachFollowButtons() {
        document.querySelectorAll(".follow-btn").forEach(btn => {
            btn.onclick = async () => {
                const targetId = btn.dataset.id;
                const action = btn.dataset.action === 'unfollow' ? 'unfollow' : 'follow';
                const token = localStorage.getItem('busahmed_token');
                try {
                    const response = await fetch(API_BASE + 'follow.php?token=' + encodeURIComponent(token), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: targetId, action }),
                        mode: 'cors'
                    });
                    const data = await response.json();
                    if (data.success) {
                        showToast(action === 'follow' ? 'Followed!' : 'Unfollowed');
                        loadFollowers();
                        loadFollowing();
                        if (document.getElementById('searchUsers').value.length >= 2) {
                            performSearch();
                        }
                    } else {
                        showToast(data.error || "Failed", true);
                    }
                } catch(err) {
                    showToast("Network error", true);
                }
            };
        });
    }

    async function performSearch() {
        const query = document.getElementById("searchUsers").value.trim();
        if (query.length < 2) { 
            document.getElementById("searchResults").innerHTML = ""; 
            return; 
        }
        const token = localStorage.getItem('busahmed_token');
        if (!token) return;
        try {
            const response = await fetch(API_BASE + 'search-users.php?q=' + encodeURIComponent(query) + '&token=' + encodeURIComponent(token), {
                mode: 'cors'
            });
            const users = await response.json();
            if (!users || users.length === 0) {
                document.getElementById("searchResults").innerHTML = '<p>No users found</p>';
                return;
            }
            let html = '<div style="margin-bottom:8px;"><strong>Search Results:</strong></div>';
            users.forEach(u => {
                const isFollowing = currentUser?.following?.includes(u.id);
                html += `<div class="user-card">
                            <div class="user-info">
                                <div class="profile-pic">${u.avatar ? `<img src="${u.avatar}">` : '<i class="fas fa-user"></i>'}</div>
                                <div><strong>${escapeHtml(u.name)}</strong><br>${escapeHtml(u.role)} | ${escapeHtml(u.school || u.class || u.subject || '')}</div>
                            </div>
                            <button class="follow-btn ${isFollowing ? 'following' : ''}" data-id="${u.id}" data-action="${isFollowing ? 'unfollow' : 'follow'}">${isFollowing ? 'Following ✓' : 'Follow'}</button>
                        </div>`;
            });
            document.getElementById("searchResults").innerHTML = html;
            attachFollowButtons();
        } catch(err) { 
            console.error(err);
            document.getElementById("searchResults").innerHTML = '<p>Error searching users</p>';
        }
    }

    async function init() {
        currentUser = await checkAuth();
        if (!currentUser) return;
        
        await loadFollowers();
        await loadFollowing();
        
        document.getElementById("backBtn").onclick = goBack;
        
        document.getElementById("searchUsers").oninput = () => {
            if (searchTimeout) clearTimeout(searchTimeout);
            searchTimeout = setTimeout(performSearch, 500);
        };
        
        document.querySelectorAll(".tab").forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
                tab.classList.add("active");
                const show = tab.dataset.tab;
                document.getElementById("followersList").style.display = show === "followers" ? "block" : "none";
                document.getElementById("followingList").style.display = show === "following" ? "block" : "none";
                document.getElementById("searchResults").innerHTML = "";
                document.getElementById("searchUsers").value = "";
            };
        });
        
        if (localStorage.getItem("busahmed_dark_mode") === "true") document.body.classList.add("dark-mode");
    }
    
    init();
</script>
</body>
</html>
