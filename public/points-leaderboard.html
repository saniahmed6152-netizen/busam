<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>BUSAHMED | Leaderboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link rel="apple-touch-icon" href="/icons/icon-152x152.png" sizes="152x152">
    <link rel="apple-touch-icon" href="/icons/icon-167x167.png" sizes="167x167">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
    <link rel="shortcut icon" href="/icons/favicon.ico">
    
    <!-- Microsoft Tiles -->
    <meta name="msapplication-square70x70logo" content="/icons/icon-72x72.png">
    <meta name="msapplication-square150x150logo" content="/icons/icon-144x144.png">
    <meta name="msapplication-wide310x150logo" content="/icons/icon-384x384.png">
    <meta name="msapplication-square310x310logo" content="/icons/icon-512x512.png">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #1e1b4b, #4f46e5); min-height: 100vh; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .card { background: white; border-radius: 32px; padding: 24px; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.2); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        h1 { font-size: 24px; color: #1e1b4b; display: flex; align-items: center; gap: 10px; }
        .back-btn { background: #e2e8f0; border: none; border-radius: 40px; padding: 8px 20px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .back-btn:hover { background: #cbd5e1; }
        .month-selector { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
        .month-selector select, .month-selector button { padding: 8px 16px; border-radius: 40px; border: 1px solid #e2e8f0; font-size: 14px; }
        .month-selector select { background: white; }
        .month-selector button { background: #4f46e5; color: white; border: none; cursor: pointer; transition: 0.2s; }
        .month-selector button:hover { background: #4338ca; }
        .user-rank-card { background: #eef2ff; border-radius: 20px; padding: 16px; margin-bottom: 20px; border-left: 4px solid #4f46e5; }
        .user-rank-card .rank-number { font-size: 32px; font-weight: 700; color: #4f46e5; }
        .user-rank-card .rank-label { font-size: 14px; color: #64748b; }
        .leaderboard-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 20px; margin-bottom: 8px; transition: 0.2s; background: #f8fafc; border: 1px solid #e2e8f0; }
        .leaderboard-item:hover { background: #eef2ff; transform: scale(1.01); }
        .leaderboard-item .position { width: 32px; font-weight: 700; color: #94a3b8; text-align: center; }
        .leaderboard-item .position.top1 { color: #fbbf24; font-size: 20px; }
        .leaderboard-item .position.top2 { color: #94a3b8; font-size: 18px; }
        .leaderboard-item .position.top3 { color: #d97706; font-size: 16px; }
        .leaderboard-item .avatar { width: 40px; height: 40px; border-radius: 50%; background: #cbd5e1; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; font-size: 18px; color: #475569; }
        .leaderboard-item .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .leaderboard-item .info { flex: 1; min-width: 0; }
        .leaderboard-item .info .name { font-weight: 600; }
        .leaderboard-item .info .role { font-size: 12px; color: #64748b; }
        .leaderboard-item .info .activity-count { font-size: 11px; color: #94a3b8; }
        .leaderboard-item .points { font-weight: 700; font-size: 18px; color: #4f46e5; }
        .leaderboard-item .movement { font-size: 12px; }
        .leaderboard-item .movement.up { color: #10b981; }
        .leaderboard-item .movement.down { color: #ef4444; }
        .leaderboard-item .movement.same { color: #94a3b8; }
        .leaderboard-item.current-user { background: #eef2ff; border-color: #4f46e5; border-width: 2px; }
        .dark-mode { background: #0f172a; }
        .dark-mode .card { background: #1e293b; }
        .dark-mode h1 { color: #f1f5f9; }
        .dark-mode .back-btn { background: #334155; color: #e2e8f0; }
        .dark-mode .back-btn:hover { background: #475569; }
        .dark-mode .month-selector select { background: #334155; border-color: #475569; color: white; }
        .dark-mode .leaderboard-item { background: #1e293b; border-color: #334155; color: #e2e8f0; }
        .dark-mode .leaderboard-item:hover { background: #334155; }
        .dark-mode .leaderboard-item .info .role { color: #94a3b8; }
        .dark-mode .user-rank-card { background: #1e293b; border-color: #4f46e5; }
        .dark-mode .user-rank-card .rank-label { color: #94a3b8; }
        .dark-mode .leaderboard-item .points { color: #a5b4fc; }
        .dark-mode .leaderboard-item.current-user { background: #334155; border-color: #4f46e5; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 8px 20px; border-radius: 40px; font-size: 14px; z-index: 2000; }
        .loading-spinner { text-align: center; padding: 40px; color: #94a3b8; }
        .loading-spinner i { font-size: 30px; display: block; margin-bottom: 12px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 40px 20px; color: #94a3b8; }
        .empty-state i { font-size: 40px; display: block; margin-bottom: 12px; opacity: 0.5; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <h1><i class="fas fa-trophy" style="color:#4f46e5;"></i> Leaderboard</h1>
            <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> Back</button>
        </div>
        
        <div class="month-selector">
            <select id="monthSelect">
                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
            </select>
            <select id="yearSelect"></select>
            <button id="loadLeaderboardBtn"><i class="fas fa-chart-line"></i> Load</button>
        </div>
        
        <div id="userRankContainer"></div>
        <div id="leaderboardList">
            <div class="loading-spinner"><i class="fas fa-spinner"></i> Loading leaderboard...</div>
        </div>
    </div>
</div>

<script>
const API_BASE = window.location.origin + '/api/';
    let currentUser = null;

    function showToast(msg, isError = false) {
        const t = document.createElement("div");
        t.className = "toast";
        t.innerText = msg;
        if (isError) t.style.background = "#dc2626";
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    function getToken() {
        return localStorage.getItem('busahmed_token');
    }

    async function checkAuth() {
        const token = getToken();
        if (!token) {
            window.location.href = 'login.html';
            return null;
        }
        try {
            const response = await fetch(API_BASE + 'profile.php?token=' + encodeURIComponent(token));
            if (!response.ok) {
                localStorage.clear();
                window.location.href = 'login.html';
                return null;
            }
            currentUser = await response.json();
            return currentUser;
        } catch(err) {
            console.error("Auth error:", err);
            window.location.href = 'login.html';
            return null;
        }
    }

    function goBack() {
        if (currentUser) {
            if (currentUser.role === 'student') window.location.href = 'dashboard-student.html';
            else if (currentUser.role === 'teacher') window.location.href = 'dashboard-teacher.html';
            else if (currentUser.role === 'admin') window.location.href = 'dashboard-admin.html';
            else if (currentUser.role === 'owner') window.location.href = 'dashboard-owner.html';
            else window.location.href = 'login.html';
        } else {
            window.location.href = 'login.html';
        }
    }

    function getRankEmoji(rank) {
        if (rank === 1) return '🥇';
        if (rank === 2) return '🥈';
        if (rank === 3) return '🥉';
        return '#';
    }

    function getPositionClass(rank) {
        if (rank === 1) return 'top1';
        if (rank === 2) return 'top2';
        if (rank === 3) return 'top3';
        return '';
    }

    async function loadLeaderboard() {
        const month = document.getElementById('monthSelect').value;
        const year = document.getElementById('yearSelect').value;
        const container = document.getElementById('leaderboardList');
        const userRankContainer = document.getElementById('userRankContainer');
        
        container.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner"></i> Loading leaderboard...</div>';
        userRankContainer.innerHTML = '';
        
        try {
            const response = await fetch(`${API_BASE}monthly-leaderboard.php?month=${month}&year=${year}&limit=100`);
            const data = await response.json();
            
            if (!data.success) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>${escapeHtml(data.error)}</div>`;
                return;
            }
            
            // Show user rank
            if (data.user_rank > 0) {
                const rankEmoji = getRankEmoji(data.user_rank);
                userRankContainer.innerHTML = `
                    <div class="user-rank-card">
                        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                            <div>
                                <div class="rank-number">${rankEmoji} #${data.user_rank}</div>
                                <div class="rank-label">Your rank for ${data.month_name} ${data.year}</div>
                            </div>
                            <div style="text-align:right;">
                                <div style="font-size:24px; font-weight:700; color:#4f46e5;">${data.user_points}</div>
                                <div class="rank-label">Points</div>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            if (!data.leaderboard || data.leaderboard.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-trophy"></i>No activity yet for ${data.month_name} ${data.year}</div>`;
                return;
            }
            
            let html = '';
            data.leaderboard.forEach((item, index) => {
                const rank = index + 1;
                const rankEmoji = getRankEmoji(rank);
                const posClass = getPositionClass(rank);
                const isCurrentUser = currentUser && item.user_id == currentUser.id;
                const avatarHtml = item.user_avatar ? `<img src="${item.user_avatar}">` : `<i class="fas fa-user"></i>`;
                const verifiedBadge = item.user_verified ? '<i class="fas fa-check-circle" style="color:#10b981;font-size:12px;margin-left:4px;"></i>' : '';
                
                // Movement simulation - in real app, compare with previous month
                const movement = Math.random() > 0.6 ? 'up' : (Math.random() > 0.5 ? 'down' : 'same');
                const movementIcon = movement === 'up' ? '↑' : (movement === 'down' ? '↓' : '—');
                const movementClass = movement === 'up' ? 'up' : (movement === 'down' ? 'down' : 'same');
                const movementText = movement === 'up' ? '(+' + Math.floor(Math.random() * 5 + 1) + ')' : (movement === 'down' ? '(-' + Math.floor(Math.random() * 5 + 1) + ')' : '');
                
                html += `
                    <div class="leaderboard-item ${isCurrentUser ? 'current-user' : ''}">
                        <div class="position ${posClass}">${rankEmoji}</div>
                        <div class="avatar">${avatarHtml}</div>
                        <div class="info">
                            <div class="name">${escapeHtml(item.user_name)} ${verifiedBadge}</div>
                            <div class="role">${item.user_role}</div>
                            <div class="activity-count">${item.activity_count || 0} activities</div>
                        </div>
                        <div style="text-align:right;">
                            <div class="points">${item.points}</div>
                            <div class="movement ${movementClass}">${movementIcon} ${movementText}</div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            
        } catch(err) {
            console.error('Load leaderboard error:', err);
            container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>Error loading leaderboard</div>`;
        }
    }

    function populateYearSelector() {
        const select = document.getElementById('yearSelect');
        const currentYear = new Date().getFullYear();
        select.innerHTML = '';
        for (let year = currentYear; year >= currentYear - 2; year--) {
            const option = document.createElement('option');
            option.value = year;
            option.textContent = year;
            if (year === currentYear) option.selected = true;
            select.appendChild(option);
        }
    }

    function setCurrentMonth() {
        const currentMonth = new Date().getMonth() + 1;
        document.getElementById('monthSelect').value = currentMonth;
    }

    async function init() {
        await checkAuth();
        if (!currentUser) return;
        
        populateYearSelector();
        setCurrentMonth();
        await loadLeaderboard();
        
        document.getElementById('backBtn').onclick = goBack;
        document.getElementById('loadLeaderboardBtn').onclick = loadLeaderboard;
        
        if (localStorage.getItem("busahmed_dark_mode") === "true") document.body.classList.add("dark-mode");
    }
    
    init();
</script>
</body>
</html>
