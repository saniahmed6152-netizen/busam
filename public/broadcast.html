    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #1e1b4b, #4f46e5); min-height: 100vh; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .card { background: white; border-radius: 32px; padding: 24px; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.2); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        h1 { font-size: 24px; color: #1e1b4b; display: flex; align-items: center; gap: 10px; }
        .back-btn { background: #e2e8f0; border: none; border-radius: 40px; padding: 8px 20px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .back-btn:hover { background: #cbd5e1; }
        
        .broadcast-form { margin-top: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: #1e293b; }
        .form-group input, .form-group textarea { 
            width: 100%; 
            padding: 12px 16px; 
            border: 1px solid #e2e8f0; 
            border-radius: 20px; 
            outline: none; 
            font-size: 14px;
            transition: 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus { 
            border-color: #4f46e5; 
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }
        .form-group textarea { min-height: 150px; resize: vertical; font-family: inherit; }
        
        .send-btn { 
            background: #4f46e5; 
            color: white; 
            border: none; 
            border-radius: 40px; 
            padding: 14px 24px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600;
            width: 100%;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .send-btn:hover { background: #4338ca; }
        .send-btn:disabled { background: #94a3b8; cursor: not-allowed; }
        
        .stats-box { 
            background: #f1f5f9; 
            border-radius: 20px; 
            padding: 16px; 
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 12px;
        }
        .stat-item { text-align: center; }
        .stat-number { font-size: 28px; font-weight: 700; color: #4f46e5; }
        .stat-label { font-size: 12px; color: #64748b; }
        
        .result-box { 
            margin-top: 20px; 
            padding: 16px; 
            border-radius: 20px; 
            display: none;
        }
        .result-box.success { 
            background: #d1fae5; 
            border: 1px solid #10b981; 
            display: block;
        }
        .result-box.error { 
            background: #fee2e2; 
            border: 1px solid #ef4444; 
            display: block;
        }
        .result-box .result-title { font-weight: 700; margin-bottom: 8px; }
        .result-box .result-details { font-size: 14px; }
        .result-box .result-details .success-item { color: #059669; }
        .result-box .result-details .error-item { color: #dc2626; }
        
        .preview-box {
            background: #f8fafc;
            border-radius: 16px;
            padding: 16px;
            margin-top: 12px;
            border: 1px dashed #cbd5e1;
        }
        .preview-box .preview-title { font-weight: 700; color: #4f46e5; }
        .preview-box .preview-message { white-space: pre-wrap; margin-top: 8px; font-size: 14px; color: #1e293b; }
        
        .dark-mode { background: #0f172a; }
        .dark-mode .card { background: #1e293b; }
        .dark-mode h1 { color: #f1f5f9; }
        .dark-mode .back-btn { background: #334155; color: #e2e8f0; }
        .dark-mode .back-btn:hover { background: #475569; }
        .dark-mode .form-group label { color: #e2e8f0; }
        .dark-mode .form-group input, .dark-mode .form-group textarea { 
            background: #334155; 
            border-color: #475569; 
            color: white; 
        }
        .dark-mode .form-group input::placeholder, .dark-mode .form-group textarea::placeholder { color: #94a3b8; }
        .dark-mode .stats-box { background: #0f172a; border: 1px solid #334155; }
        .dark-mode .stat-label { color: #94a3b8; }
        .dark-mode .preview-box { background: #0f172a; border-color: #334155; }
        .dark-mode .preview-box .preview-message { color: #e2e8f0; }
        .dark-mode .result-box.success { background: #064e3b; border-color: #10b981; }
        .dark-mode .result-box.error { background: #7f1d1d; border-color: #ef4444; }
        
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 8px 20px; border-radius: 40px; font-size: 14px; z-index: 2000; }
        
        @media (max-width: 600px) {
            .card { padding: 16px; }
            .stats-box { gap: 8px; }
            .stat-number { font-size: 20px; }
        }

<body>
<div class="container">
    <div class="card">
        <div class="header">
            <h1><i class="fas fa-bullhorn" style="color:#4f46e5;"></i> Broadcast Message</h1>
            <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> Back</button>
        </div>
        
        <div class="stats-box" id="statsBox">
            <div class="stat-item">
                <div class="stat-number" id="totalUsers">0</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="onlineUsers">0</div>
                <div class="stat-label">Online Now</div>
            </div>
        </div>
        
        <div class="broadcast-form">
            <div class="form-group">
                <label><i class="fas fa-tag"></i> Message Title</label>
                <input type="text" id="broadcastTitle" placeholder="e.g., Important Update, New Feature, etc." value="📢 Announcement">
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-comment"></i> Message Content</label>
                <textarea id="broadcastMessage" placeholder="Type your broadcast message here... This will be sent to all users."></textarea>
            </div>
            
            <div class="preview-box">
                <div class="preview-title">📋 Preview</div>
                <div class="preview-message" id="previewContent">Your message preview will appear here...</div>
            </div>
            
            <button class="send-btn" id="sendBroadcastBtn">
                <i class="fas fa-paper-plane"></i> Send to All Users
            </button>
            
            <div id="resultBox" class="result-box"></div>
        </div>
    </div>
</div>

<script>
const API_BASE = window.location.origin + '/api/';
    let currentUser = null;
    let totalUsers = 0;

    function showToast(msg, isError = false) {
        const t = document.createElement("div");
        t.className = "toast";
        t.innerText = msg;
        if (isError) t.style.background = "#dc2626";
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    function getToken() {
        return localStorage.getItem('busahmed_token');
    }

    async function checkAuth() {
        const token = getToken();
        if (!token) {
            window.location.href = 'login.html';
            return null;
        }
        try {
            const response = await fetch(API_BASE + 'profile.php?token=' + encodeURIComponent(token));
            if (!response.ok) {
                localStorage.clear();
                window.location.href = 'login.html';
                return null;
            }
            currentUser = await response.json();
            
            if (currentUser.role !== 'admin') {
                showToast('Only admins can access this page', true);
                setTimeout(() => window.location.href = 'dashboard-admin.html', 2000);
                return null;
            }
            
            return currentUser;
        } catch(err) {
            console.error("Auth error:", err);
            window.location.href = 'login.html';
            return null;
        }
    }

    async function loadUserStats() {
        const token = getToken();
        if (!token) return;
        try {
            const response = await fetch(API_BASE + 'admin-users.php?token=' + encodeURIComponent(token));
            const users = await response.json();
            totalUsers = users.length;
            document.getElementById('totalUsers').textContent = totalUsers;
            
            // Estimate online users (users with recent activity - for demo)
            const online = Math.min(totalUsers, Math.floor(totalUsers * 0.3) + 1);
            document.getElementById('onlineUsers').textContent = online;
        } catch(err) {
            console.error("Error loading user stats:", err);
        }
    }

    function updatePreview() {
        const title = document.getElementById('broadcastTitle').value || 'Broadcast Message';
        const message = document.getElementById('broadcastMessage').value || 'Your message will appear here...';
        const previewContent = document.getElementById('previewContent');
        previewContent.innerHTML = '📢 <strong>' + escapeHtml(title) + '</strong>\n\n' + escapeHtml(message) + '\n\n---\nSent by Admin';
    }

    async function sendBroadcast() {
        const title = document.getElementById('broadcastTitle').value.trim();
        const message = document.getElementById('broadcastMessage').value.trim();
        
        if (!message) {
            showToast('Please enter a message to send', true);
            return;
        }
        
        const btn = document.getElementById('sendBroadcastBtn');
        const resultBox = document.getElementById('resultBox');
        
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
        resultBox.className = 'result-box';
        resultBox.style.display = 'none';
        
        const token = getToken();
        try {
            const response = await fetch(API_BASE + 'broadcast-message.php?token=' + encodeURIComponent(token), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, message })
            });
            
            const data = await response.json();
            
            if (data.success) {
                resultBox.className = 'result-box success';
                resultBox.style.display = 'block';
                resultBox.innerHTML = `
                    <div class="result-title">✅ Broadcast Sent Successfully!</div>
                    <div class="result-details">
                        <p>📊 Total Users: ${data.total_users}</p>
                        <p>✅ Sent: ${data.success_count}</p>
                        ${data.error_count > 0 ? `<p>❌ Failed: ${data.error_count}</p>` : ''}
                        <p style="margin-top:8px; font-size:13px; color: #64748b;">${data.message}</p>
                    </div>
                `;
                
                // Show detailed results
                if (data.results && data.results.length > 0) {
                    let detailsHtml = '<div style="margin-top:12px; max-height:200px; overflow-y:auto; font-size:13px;">';
                    data.results.forEach(r => {
                        const statusClass = r.status === 'success' ? 'success-item' : 'error-item';
                        const icon = r.status === 'success' ? '✅' : '❌';
                        detailsHtml += `<div class="${statusClass}">${icon} ${escapeHtml(r.user_name)}</div>`;
                    });
                    detailsHtml += '</div>';
                    resultBox.innerHTML += detailsHtml;
                }
                
                // Clear message field after successful send
                document.getElementById('broadcastMessage').value = '';
                updatePreview();
                showToast('Broadcast sent successfully!');
            } else {
                resultBox.className = 'result-box error';
                resultBox.style.display = 'block';
                resultBox.innerHTML = `
                    <div class="result-title">❌ Failed to Send</div>
                    <div class="result-details">${escapeHtml(data.error || 'Unknown error occurred')}</div>
                `;
                showToast(data.error || 'Failed to send broadcast', true);
            }
        } catch(err) {
            console.error('Broadcast error:', err);
            resultBox.className = 'result-box error';
            resultBox.style.display = 'block';
            resultBox.innerHTML = `
                <div class="result-title">❌ Network Error</div>
                <div class="result-details">${escapeHtml(err.message)}</div>
            `;
            showToast('Network error: ' + err.message, true);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send to All Users';
        }
    }

    async function goBack() {
        window.location.href = 'dashboard-admin.html';
    }

    async function init() {
        await checkAuth();
        if (!currentUser) return;
        await loadUserStats();
        
        document.getElementById('backBtn').onclick = goBack;
        document.getElementById('sendBroadcastBtn').onclick = sendBroadcast;
        
        // Live preview
        document.getElementById('broadcastTitle').addEventListener('input', updatePreview);
        document.getElementById('broadcastMessage').addEventListener('input', updatePreview);
        
        updatePreview();
        
        if (localStorage.getItem("busahmed_dark_mode") === "true") document.body.classList.add("dark-mode");
    }
    
    init();
</script>
</body>
